  --text-sm: 0.8125rem;

  --text-lg: 1.25rem;
  --text-xl: 1.5rem;

  --weight-semibold: 600;
  --weight-bold: 700;

@keyframes fadeInUp {

  to   { opacity: 1; }

    .nav-tab:hover {
      opacity: 0.85;
    }
    .nav-tab:active {
      transform: scale(0.94);
    }

    /* ===== 响应式 ===== */
    @media (min-width: 481px) {
      .app-container {
        border-left: 1px solid var(--border-light);
        border-right: 1px solid var(--border-light);
      }
    }

    @media (max-width: 360px) {
      :root {
        --content-padding: 0.75rem;
      }
      .dashboard-grid {
        grid-template-columns: 1fr;
      }
      .hero-title {
        font-size: var(--text-lg);
      }
    }

    /* ===== 登录页 ===== */
    .login-page {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-xl);
      background: #fff;
    }
    .login-card {
      width: 100%;
      max-width: 360px;
      text-align: center;
      padding: var(--space-2xl) var(--space-xl);
      background: #fff;
      border-radius: var(--radius-xl);
      box-shadow: 0 2px 24px rgba(0, 0, 0, 0.05), 0 1px 4px rgba(0, 0, 0, 0.03);
      border: 1px solid var(--border-light);
    }
    .login-doodle {
      margin-bottom: var(--space-lg);
    }
    .login-couple-photo {
      width: 100px;
      height: 100px;
      border-radius: var(--radius-full);
      overflow: hidden;
      margin: 0 auto;
      border: 2px solid #fff;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      cursor: pointer;
      position: relative;
      transition: all var(--transition-fast);
    }
    .login-couple-photo:hover {
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }
    .login-couple-photo .photo-change-hint {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 4px;
      background: rgba(0,0,0,0.6);
      color: #fff;
      font-size: 10px;
      text-align: center;
      opacity: 0;
      transition: opacity var(--transition-fast);
      font-family: var(--font-sans);
    }
    .login-couple-photo:hover .photo-change-hint {
      opacity: 1;
    }
    .login-couple-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .login-label {
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: var(--weight-medium);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--color-text-light);
      margin-bottom: var(--space-xs);
    }
    .login-title {
      font-family: var(--font-serif);
      font-size: 24px;
      font-weight: var(--weight-bold);
      color: var(--color-text);
      margin: 0 0 var(--space-sm) 0;
      letter-spacing: 0.05em;
    }
    .login-desc {
      font-family: var(--font-sans);
      font-size: 13px;
      color: var(--color-text-light);
      margin: 0 0 var(--space-xl) 0;
      line-height: 1.6;
    }
    .login-form {
      margin-bottom: var(--space-md);
    }
    .login-form .input-group {
      margin-bottom: var(--space-md);
    }
    .login-input {
      text-align: center;
      font-size: 16px;
      letter-spacing: 0.1em;
      padding: var(--space-md) var(--space-lg);
      border-radius: 14px;
      background: #fff;
      border: 2px solid var(--border-color);
      transition: all var(--transition-fast);
    }
    .login-input:focus {
      border-color: var(--text-primary);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(0, 0, 0, 0.04);
    }
    .login-btn {
      width: 100%;
      padding: 14px;
      font-size: 15px;
      font-weight: var(--weight-semibold);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all var(--transition-fast);
      background: var(--text-primary);
      color: #fff;
    }
    .login-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .login-error {
      padding: var(--space-sm) var(--space-md);
      background: #F5F5F5;
      color: #1A1A1A;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: var(--space-md);
      font-family: var(--font-sans);
    }
    .login-hint {
      font-family: var(--font-sans);
      font-size: 11px;
      color: var(--text-muted);
      opacity: 0.5;
      margin-top: var(--space-md);
    }
    .login-hint code {
      background: #F5F5F5;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      color: var(--text-primary);
      font-family: var(--font-mono, monospace);
    }
  </style>

  <!-- 骨架屏：JS 加载前显示，避免白屏 -->
  <style>
    #app-skeleton {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      background: #fff;
      transition: opacity 0.35s ease;
      position: fixed;
      inset: 0;
      z-index: 9999;
    }
    #app-skeleton.hide {
      opacity: 0;
      pointer-events: none;
    }
    .skeleton-heart {
      width: 56px;
      height: 56px;
      margin-bottom: 18px;
      animation: skeleton-pulse 1.6s ease-in-out infinite;
    }
    .skeleton-text {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      font-size: 14px;
      color: #D4C5C5;
      letter-spacing: 0.08em;
    }
    @keyframes skeleton-pulse {
      0%, 100% { opacity: 0.55; transform: scale(0.96); }
      50% { opacity: 1; transform: scale(1.04); }
    }
  </style>
</head>
<body>
  <div id="app-skeleton">
    <svg class="skeleton-heart" viewBox="0 0 24 24" fill="none" stroke="#E8A0A0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
    </svg>
    <div class="skeleton-text">正在进入小宇宙...</div>
    <button id="skeleton-safe-btn" type="button" style="margin-top:24px;padding:8px 16px;font-size:12px;color:#BFA8A8;background:transparent;border:1px solid #E8D5D5;border-radius:20px;display:none;">点我重新进入</button>
  </div>
  <script>
    // 兜底：如果 4 秒后还在骨架屏，显示重新进入按钮
    (function(){
      var t = setTimeout(function(){
        var btn = document.getElementById('skeleton-safe-btn');
        var sk = document.getElementById('app-skeleton');
        if (sk && !sk.classList.contains('hide') && btn) {
          btn.style.display = 'inline-block';
          btn.onclick = function(){
            try { sessionStorage.removeItem('love_token'); sessionStorage.removeItem('love_name'); } catch(e){}
            location.reload();
          };
        }
      }, 4000);
      window.addEventListener('load', function(){ clearTimeout(t); });
    })();
  </script>

  <div class="app-container" id="app" style="display:none">
    <!-- 由 App.render() 动态渲染 -->
  </div>

  <script>/* js/modules/github-sync.js */
/* ===== 【我们的恋爱小宇宙】GitHub 数据同步 ===== */
window.GitHubSync = {
  _config: null,
  _sha: null, // 当前文件 SHA（用于更新）
  _syncInProgress: false,

  get config() {
    if (!this._config) this._config = APP_CONFIG.github;
    return this._config;
  },

  _headers() {
    return {
      'Authorization': `token ${this.config.token}`,
      'Accept': 'application/vnd.github.v3+json',
      'Content-Type': 'application/json'
    };
  },

  // 确保仓库和文件存在
  async initRepo() {
    const { owner, repo, dataFile, apiBase } = this.config;

    // 检查仓库是否存在，不存在则创建
    let resp = await fetch(`${apiBase}/repos/${owner}/${repo}`, {
      headers: this._headers()
    });

    if (resp.status === 404) {
      console.log('📦 创建私有仓库...');
      resp = await fetch(`${apiBase}/user/repos`, {
        method: 'POST',
        headers: this._headers(),
        body: JSON.stringify({
          name: repo,
          private: true,
          description: '恋爱小宇宙数据同步',
          auto_init: true
        })
      });
      if (!resp.ok) {
        console.error('创建仓库失败:', await resp.json());
        throw new Error('创建仓库失败');
      }
      console.log('✅ 仓库已创建');
    }

    // 获取 data.json 的 SHA
    resp = await fetch(`${apiBase}/repos/${owner}/${repo}/contents/${dataFile}`, {
      headers: this._headers()
    });

    if (resp.ok) {
      const item = await resp.json();
      this._sha = item.sha;
      const binary = atob(item.content);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      const decoded = new TextDecoder('utf-8').decode(bytes);
      const data = JSON.parse(decoded);
      console.log('📥 已加载远程数据, version:', data._version || 0);
      return data;
    } else if (resp.status === 404) {
      console.log('📝 首次使用，创建初始数据');
      return null;
    } else {
      throw new Error(`读取仓库失败: ${resp.status}`);
    }
  },

  // 从 GitHub 拉取数据
  async pull() {
    if (this._syncInProgress) return null;
    this._syncInProgress = true;
    try {
      const { owner, repo, dataFile, apiBase } = this.config;
      const resp = await fetch(`${apiBase}/repos/${owner}/${repo}/contents/${dataFile}`, {
        headers: this._headers(),
        cache: 'no-store'
      });

      if (resp.status === 404) return null;
      if (!resp.ok) throw new Error(`拉取失败: ${resp.status}`);

      const item = await resp.json();
      this._sha = item.sha;
      // GitHub 返回 base64，用 Uint8Array 解码 utf-8
      const binary = atob(item.content);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      const decoded = new TextDecoder('utf-8').decode(bytes);
      const data = JSON.parse(decoded);
      return data;
    } catch (e) {
      console.warn('GitHub pull 失败:', e.message);
      return null;
    } finally {
      this._syncInProgress = false;
    }
  },

  // 推送到 GitHub
  async push(data) {
    if (this._syncInProgress) return false;
    this._syncInProgress = true;
    try {
      const { owner, repo, dataFile, apiBase } = this.config;

      // 更新版本号
      data._version = (data._version || 0) + 1;
      data._updatedAt = new Date().toISOString();
      data._updatedBy = window.Auth ? Auth.getToken()?.substring(0, 8) : 'unknown';

      const content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));
      const body = {
        message: `💾 v${data._version} - ${data._updatedBy}`,
        content: content,
        branch: this.config.branch
      };

      if (this._sha) {
        body.sha = this._sha;
      }

      const resp = await fetch(`${apiBase}/repos/${owner}/${repo}/contents/${dataFile}`, {
        method: 'PUT',
        headers: this._headers(),
        body: JSON.stringify(body)
      });

      if (!resp.ok) {
        const err = await resp.json();
        console.error('推送失败:', err);
        return false;
      }

      const result = await resp.json();
      this._sha = result.content.sha;
      console.log('✅ 已同步到 GitHub, v' + data._version);
      return true;
    } catch (e) {
      console.warn('GitHub push 失败:', e.message);
      return false;
    } finally {
      this._syncInProgress = false;
    }
  }
};

/* ===== 【我们的恋爱小宇宙】Supabase 实时通信 ===== */
window.GameSync = {
  _supabase: null,
  _channel: null,
  _roomId: null,
  _listeners: {},

  get supabase() {
    if (!this._supabase) {
      if (typeof supabase === 'undefined') {
        console.error('Supabase SDK 未加载');
        return null;
      }
      this._supabase = supabase.createClient(
        APP_CONFIG.supabase.url,
        APP_CONFIG.supabase.anonKey
      );
    }
    return this._supabase;
  },

  // 加入游戏房间（用暗号 hash 作为房间ID）
  async joinRoom(roomId) {
    this._roomId = roomId;
    if (!this.supabase) return false;

    // 离开之前的频道
    if (this._channel) {
      await this._channel.unsubscribe();
    }

    // 创建新频道
    this._channel = this.supabase.channel(`game:${roomId}`, {
      config: { broadcast: { self: false } }
    });

    // 监听消息
    this._channel.on('broadcast', { event: 'game_action' }, (payload) => {
      const data = payload.payload;
      if (this._listeners[data.type]) {
        this._listeners[data.type].forEach(fn => fn(data));
      }
      if (this._listeners['*']) {
        this._listeners['*'].forEach(fn => fn(data));
      }
    });

    // 订阅
    const status = await this._channel.subscribe();
    console.log('🎮 已加入游戏房间:', roomId, status);
    return status === 'SUBSCRIBED';
  },

  // 发送游戏动作
  send(type, data = {}) {
    if (!this._channel) return false;
    this._channel.send({
      type: 'broadcast',
      event: 'game_action',
      payload: { type, ...data, from: this._getUserId(), time: Date.now() }
    });
    return true;
  },

  // 注册消息监听
  on(type, fn) {
    if (!this._listeners[type]) this._listeners[type] = [];
    this._listeners[type].push(fn);
  },

  // 移除监听
  off(type, fn) {
    if (!this._listeners[type]) return;
    this._listeners[type] = this._listeners[type].filter(f => f !== fn);
  },

  // 离开房间
  async leaveRoom() {
    if (this._channel) {
      await this._channel.unsubscribe();
      this._channel = null;
    }
  },

  _getUserId() {
    return (window.Auth && Auth.getToken()) ? Auth.getToken().substring(0, 8) : 'unknown';
  }
};

  // 用日期生成确定性索引

}

function _hashStr(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    hash = ((hash << 5) - hash) + str.charCodeAt(i);
    hash |= 0;
  }
  return Math.abs(hash);
}

/* ===== 【我们的恋爱小宇宙】工具函数 ===== */
const Utils = {
  /**
   * 格式化日期为 YYYY-MM-DD
   */
  formatDate(date) {
    const d = new Date(date);
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  },

  /**
   * 格式化日期为中文格式
   */
  formatDateCN(date) {
    const d = new Date(date);
    return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
  },

  /**
   * 格式化日期为简短中文
   */
  formatDateShort(date) {
    const d = new Date(date);
    return `${d.getMonth() + 1}月${d.getDate()}日`;
  },

  /**
   * 格式化金额
   */
  formatMoney(amount) {
    return `¥${Number(amount).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
  },

  /**
   * 计算两个日期的天数差
   */
  daysBetween(date1, date2) {
    const d1 = new Date(date1);
    const d2 = new Date(date2 || new Date());
    d1.setHours(0, 0, 0, 0);
    d2.setHours(0, 0, 0, 0);
    return Math.floor((d2 - d1) / (1000 * 60 * 60 * 24));
  },

  /**
   * 获取恋爱时长（天）
   */
  getLoveDays(togetherDate) {
    return this.daysBetween(togetherDate);
  },

  /**
   * 格式化恋爱时长文案
   */
  formatLoveDuration(days) {
    if (days <= 0) return '今天';
    if (days === 1) return '1天';
    if (days < 30) return `${days}天`;
    if (days < 365) {
      const months = Math.floor(days / 30);
      const remain = days % 30;
      return remain > 0 ? `${months}个月${remain}天` : `${months}个月`;
    }
    const years = Math.floor(days / 365);
    const remainDays = days % 365;
    const remainMonths = Math.floor(remainDays / 30);
    if (remainMonths > 0) return `${years}年${remainMonths}个月`;
    return `${years}年`;
  },

  /**
   * 获取纪念日的下次日期（处理每年重复）
   */
  getNextAnniversaryDate(anniversary) {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const origDate = new Date(anniversary.date);
    const thisYear = new Date(today.getFullYear(), origDate.getMonth(), origDate.getDate());

    if (anniversary.repeatCycle === 'yearly') {
      if (thisYear >= today) return thisYear;
      return new Date(today.getFullYear() + 1, origDate.getMonth(), origDate.getDate());
    }
    // single: return original date
    return origDate;
  },

  /**
   * 获取距离纪念日的剩余天数
   */
  getDaysUntil(nextDate) {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const target = new Date(nextDate);
    target.setHours(0, 0, 0, 0);
    return Math.floor((target - today) / (1000 * 60 * 60 * 24));
  },

  /**
   * 生成唯一ID
   */
  generateId() {
    return 'id_' + Date.now().toString(36) + '_' + Math.random().toString(36).substr(2, 9);
  },

  /**
   * 按月份筛选账本数据
   */
  filterByMonth(items, year, month) {
    return items.filter(item => {
      const d = new Date(item.date);
      return d.getFullYear() === year && d.getMonth() === month;
    });
  },

  /**
   * 获取当前年月
   */
  getCurrentYearMonth() {
    const now = new Date();
    return { year: now.getFullYear(), month: now.getMonth() };
  },

  /**
   * 获取月份名称
   */
  getMonthName(month) {
    const names = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];
    return names[month];
  },

  /**
   * 分类金额汇总
   */
  categorySummary(items) {
    const summary = {};
    items.forEach(item => {
      const cat = item.category || '其他';
      summary[cat] = (summary[cat] || 0) + Number(item.amount);
    });
    return summary;
  },

  /**
   * 显示Toast提示
   */
  showToast(message, duration = 2000) {
    const existing = document.querySelector('.toast');
    if (existing) existing.remove();

    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = message;
    document.body.appendChild(toast);

    setTimeout(() => {
      toast.classList.add('toast-out');
      setTimeout(() => toast.remove(), 300);
    }, duration);
  },

  /**
   * 从localStorage安全读取
   */
  loadFromStorage(key, fallback) {
    try {
      const data = localStorage.getItem(key);
      return data ? JSON.parse(data) : fallback;
    } catch {
      return fallback;
    }
  },

   * 安全写入localStorage

  saveToStorage(key, data) {

      7: { scene: '夏天', tags: ['海边', '旅行', '避暑'] },
      8: { scene: '夏天', tags: ['海边', '旅行', '避暑'] },
      9: { scene: '秋天', tags: ['秋游', '拍照', '户外'] },
      10: { scene: '秋天', tags: ['秋游', '拍照', '户外'] },
      11: { scene: '深秋', tags: ['居家', '电影', '美食'] },
      0: { scene: '冬天', tags: ['冬季', '居家', '温泉'] },
      1: { scene: '冬天', tags: ['冬季', '居家', '温泉'] },
    };
    const season = seasonScenes[month];
    if (season) {
      contexts.push({
        scene: season.scene,
        daysUntil: 0,
        urgency: 'seasonal',
        tags: season.tags
      });
    }

    // ===== 周末判断 =====
    const dayOfWeek = today.getDay();
    if (dayOfWeek === 5) { // 周五
      contexts.push({ scene: '周末', daysUntil: 1, urgency: 'soon', tags: ['周末', '约会', '探店'] });
    } else if (dayOfWeek === 6 || dayOfWeek === 0) { // 周六日
      contexts.push({ scene: '周末', daysUntil: 0, urgency: 'now', tags: ['周末', '约会', '探店'] });
    }

    // 按紧急程度排序
    const urgencyOrder = { urgent: 0, soon: 1, upcoming: 2, now: 3, seasonal: 4 };
    contexts.sort((a, b) => (urgencyOrder[a.urgency] || 9) - (urgencyOrder[b.urgency] || 9));

    return contexts;
  }
};

// 兼容导出
if (typeof module !== 'undefined' && module.exports) {
  module.exports = Utils;
}
</script>
  <script>/* js/sfx.js */
/* ===== 【我们的恋爱小宇宙】游戏音效模块 ===== */
const SFX = {
  ctx: null,
  enabled: true,

  // 初始化音频上下文（必须在用户交互后调用）
  init() {
    if (this.ctx) return true;
    try {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return false;
      this.ctx = new AudioContext();
      return true;
    } catch (e) {
      console.warn('SFX init failed:', e);
      return false;
    }
  },

  // 用户第一次点击时初始化
  ensureInit() {
    if (!this.ctx) this.init();
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume().catch(() => {});
    }
  },

  setEnabled(v) { this.enabled = v; },
  isEnabled() { return this.enabled; },

  _now() { return this.ctx ? this.ctx.currentTime : 0; },

  _osc(type, freq, start, duration, gain = 0.1, fadeOut = true) {
    if (!this.ctx || !this.enabled) return;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, start);
    g.gain.setValueAtTime(gain, start);
    if (fadeOut) g.gain.exponentialRampToValueAtTime(0.001, start + duration);
    osc.connect(g).connect(this.ctx.destination);
    osc.start(start);
    osc.stop(start + duration);
  },

  _noise(duration, start, gain = 0.15) {
    if (!this.ctx || !this.enabled) return;
    const bufferSize = this.ctx.sampleRate * duration;
    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

    const src = this.ctx.createBufferSource();
    const g = this.ctx.createGain();
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 800;
    filter.Q.value = 0.5;

    src.buffer = buffer;
    g.gain.setValueAtTime(gain, start);
    g.gain.exponentialRampToValueAtTime(0.001, start + duration);
    src.connect(filter).connect(g).connect(this.ctx.destination);
    src.start(start);
  },

  // 短促点击反馈
  tap() {
    this.ensureInit();
    const t = this._now();
    this._osc('sine', 800, t, 0.06, 0.12);
  },

  // 摇骰子：连续短促碰撞声
  shake() {
    this.ensureInit();
    if (!this.ctx || !this.enabled) return;
    const t = this._now();
    const count = 12;
    for (let i = 0; i < count; i++) {
      const start = t + i * 0.045;
      this._noise(0.05, start, 0.08);
      this._osc('triangle', 120 + Math.random() * 200, start, 0.04, 0.06);
    }
  },

  // 开盅：清脆揭开声
  cupOpen() {
    this.ensureInit();
    const t = this._now();
    this._noise(0.08, t, 0.1);
    this._osc('sine', 600, t, 0.1, 0.12);
    this._osc('sine', 900, t + 0.04, 0.1, 0.08);
  },

  // 胜利：明亮三音阶
  win() {
    this.ensureInit();
    const t = this._now();
    [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
      this._osc('sine', freq, t + i * 0.08, 0.35, 0.12);
      this._osc('triangle', freq, t + i * 0.08, 0.25, 0.06);
    });
  },

  // 失败/输了：低沉下行
  lose() {
    this.ensureInit();
    const t = this._now();
    [392, 311, 233].forEach((freq, i) => {
      this._osc('sawtooth', freq, t + i * 0.12, 0.35, 0.08);
    });
  },

  // 答题正确：清脆叮
  correct() {
    this.ensureInit();
    const t = this._now();
    this._osc('sine', 880, t, 0.12, 0.15);
    this._osc('sine', 1760, t + 0.06, 0.2, 0.08);
  },

  // 答题错误：低沉嗡
  wrong() {
    this.ensureInit();
    const t = this._now();
    this._osc('sawtooth', 150, t, 0.25, 0.12);
    this._osc('square', 100, t + 0.08, 0.25, 0.08);
  },

  // 翻牌/抽题：轻快手风琴式
  flip() {
    this.ensureInit();
    const t = this._now();
    this._noise(0.06, t, 0.08);
    this._osc('sine', 520, t + 0.02, 0.15, 0.1);
    this._osc('sine', 740, t + 0.06, 0.15, 0.08);
  },

  // 口算提交：短促确认
  submit() {
    this.ensureInit();
    const t = this._now();
    this._osc('sine', 660, t, 0.08, 0.1);
  },

  // 游戏结束：根据输赢
  finish(isWin) {
    isWin ? this.win() : this.lose();
  }
};

// 全局点击自动初始化音效
window.addEventListener('pointerdown', () => SFX.ensureInit(), { once: true });
</script>
  <script>/* js/components.js */
/* ===== 【我们的恋爱小宇宙】可复用组件 ===== */

const Components = {
  /**
   * 渲染恋爱时长计数器
   */
  renderLoveCounter(container) {
    const profile = Store.getProfile();
    const days = Utils.getLoveDays(profile.togetherDate);
    const duration = Utils.formatLoveDuration(days);

    container.innerHTML = `
      <div class="love-counter">
        <div class="love-counter-days">${days}</div>
        <div class="love-counter-label">在一起的第 ${days} 天</div>
        <div class="love-counter-unit">${duration} · since ${profile.togetherDate}</div>
      </div>
    `;

    // 实时更新（每分钟刷新一次）
    if (this._counterInterval) clearInterval(this._counterInterval);
    this._counterInterval = setInterval(() => {
      const d = Utils.getLoveDays(profile.togetherDate);
      const dur = Utils.formatLoveDuration(d);
      container.querySelector('.love-counter-days').textContent = d;
      container.querySelector('.love-counter-label').textContent = `在一起的第 ${d} 天`;
      container.querySelector('.love-counter-unit').textContent = `${dur} · since ${profile.togetherDate}`;
    }, 60000);
  },

  /**
   * 渲染柱状图（CSS手绘）
   */
  renderBarChart(container, data, options = {}) {
    const { height = 140, barColor = 'var(--text-primary)', labels = [], values = [], valueFormatter = v => `¥${v}` } = options;

    if (labels.length === 0 && data) {
      labels.push(...data.map(d => d.label));
      values.push(...data.map(d => d.value));
    }

    const maxVal = Math.max(...values, 1);
    const bars = labels.map((label, i) => {
      const h = Math.max((values[i] / maxVal) * 100, 4);
      return `
        <div class="bar-item">
          <span class="bar-value">${valueFormatter(values[i])}</span>
          <div class="bar-fill-wrapper">
            <div class="bar-fill" style="height:${h}%; background:${barColor}"></div>
          </div>
          <span class="bar-label">${label}</span>
        </div>
      `;
    }).join('');

    container.innerHTML = `<div class="bar-chart" style="height:${height}px">${bars}</div>`;
  },

  /**
   * 渲染饼图（conic-gradient）
   */
  renderPieChart(container, segments) {
    // segments: [{ label, value, color }]
    const total = segments.reduce((s, seg) => s + seg.value, 0);
    if (total === 0) {
      container.innerHTML = '<div style="text-align:center;color:var(--text-muted);font-size:var(--text-sm)">暂无数据</div>';
      return;
    }

    let cumulative = 0;
    const gradientParts = segments.map(seg => {
      const start = cumulative;
      const pct = (seg.value / total) * 100;
      cumulative += pct;
      return `${seg.color} ${start}% ${cumulative}%`;
    }).join(', ');

    const legend = segments.map(seg => {
      const pct = ((seg.value / total) * 100).toFixed(1);
      return `
        <div class="pie-legend-item">
          <span class="pie-legend-dot" style="background:${seg.color}"></span>
          ${seg.label} · ${Utils.formatMoney(seg.value)} (${pct}%)
        </div>
      `;
    }).join('');

    container.innerHTML = `
      <div style="display:flex;align-items:center;gap:var(--space-xl);justify-content:center;flex-wrap:wrap">
        <div class="pie-chart" style="background:conic-gradient(${gradientParts})"></div>
        <div class="pie-legend">${legend}</div>
      </div>

  },

  /**
   * 渲染即将到来的纪念日列表

  /**

  renderStarRating(container, rating, readonly = true) {

          const val = parseInt(star.dataset.value);
          container.querySelectorAll('.star').forEach((s, idx) => {
            s.classList.toggle('active', idx < val);

  /**

  renderPageHeader(container, title, subtitle = '', accentColor = 'var(--color-primary)') {

  /**

  showModal(title, bodyHTML, onSave, onClose) {

    overlay.className = 'modal-overlay';

  /**

  showConfirm(title, desc, onConfirm) {

  /**
   * 图片裁剪器 - 支持拖拽移动 + 缩放
   * @param {File} file - 图片文件
   * @param {Function} onCrop - 裁剪完成回调，参数为 base64 字符串
   * @param {Object} opts - { aspectRatio: 1, outputSize: 400 }
   */
  showImageCropper(file, onCrop, opts = {}) {
    const aspectRatio = opts.aspectRatio || 1;
    const outputSize = opts.outputSize || 400;
    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

    const reader = new FileReader();
    reader.onload = (e) => {
      const imgSrc = e.target.result;
      this._renderCropper(imgSrc, aspectRatio, outputSize, onCrop, isMobile);
    };
    reader.readAsDataURL(file);
  },

  _renderCropper(imgSrc, aspectRatio, outputSize, onCrop, isMobile) {
    const overlay = document.createElement('div');
    overlay.className = 'cropper-overlay';
    overlay.innerHTML = `
      <div class="cropper-container">
        <div class="cropper-header">
          <span class="cropper-title">移动和缩放图片</span>
          <button class="cropper-close">✕</button>
        </div>
        <div class="cropper-viewport" id="cropper-vp">
          <img class="cropper-image" id="cropper-img" src="${imgSrc}" alt="crop">
          <div class="cropper-mask"></div>
        </div>
        <div class="cropper-footer">
          <div class="cropper-zoom-bar">
            <span class="cropper-zoom-label">缩放</span>
            <input type="range" class="cropper-zoom-slider" id="cropper-slider" min="0.5" max="3" step="0.01" value="1">
          </div>
          <div class="cropper-actions">
            <button class="btn btn-ghost cropper-cancel">取消</button>
            <button class="btn btn-primary cropper-confirm">确定</button>
          </div>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);

    const img = overlay.querySelector('#cropper-img');
    const viewport = overlay.querySelector('#cropper-vp');
    const slider = overlay.querySelector('#cropper-slider');

    let scale = 1;
    let offsetX = 0, offsetY = 0;
    let isDragging = false;
    let startX, startY, startOffX, startOffY;
    let lastDist = 0;
    let imgNaturalW, imgNaturalH;

    const clampOffset = () => {
      if (!imgNaturalW || !imgNaturalH) return;
      const vpW = viewport.clientWidth;
      const vpH = viewport.clientHeight;
      const w = imgNaturalW * scale;
      const h = imgNaturalH * scale;
      const maxX = Math.max(0, (w - vpW) / 2);
      const maxY = Math.max(0, (h - vpH) / 2);
      offsetX = Math.max(-maxX, Math.min(maxX, offsetX));
      offsetY = Math.max(-maxY, Math.min(maxY, offsetY));
    };

    const updateTransform = () => {
      clampOffset();
      img.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
    };

    const initImage = () => {
      imgNaturalW = img.naturalWidth;
      imgNaturalH = img.naturalHeight;
      if (!imgNaturalW || !imgNaturalH) return;
      // 默认显示完整图片（fit 模式，不裁切）
      const vpW = viewport.clientWidth;
      const vpH = viewport.clientHeight;
      scale = Math.min(vpW / imgNaturalW, vpH / imgNaturalH);
      if (scale < 0.5) scale = 0.5;
      if (scale > 3) scale = 3;
      slider.value = scale;
      offsetX = 0;
      offsetY = 0;

      // 更新遮罩層大小，匹配圖片長寬比
      const mask = overlay.querySelector('.cropper-mask');
      if (mask) {
        const imgRatio = imgNaturalW / imgNaturalH;
        const maxMaskSize = Math.min(vpW, vpH) * 0.85;
        if (imgRatio >= 1) {
          // 橫向圖片：遮罩寬 = maxMaskSize，高 = 寬 / ratio
          mask.style.width = `${maxMaskSize}px`;
          mask.style.height = `${maxMaskSize / imgRatio}px`;
        } else {
          // 豎向圖片：遮罩高 = maxMaskSize，寬 = 高 * ratio
          mask.style.height = `${maxMaskSize}px`;
          mask.style.width = `${maxMaskSize * imgRatio}px`;
        }
      }

      updateTransform();
    };

    if (img.complete) {
      initImage();
    } else {
      img.onload = initImage;
    }

    // 缩放滑块
    slider.addEventListener('input', () => {
      scale = parseFloat(slider.value);
      updateTransform();
    });

    // 拖拽 - 鼠标
    viewport.addEventListener('mousedown', (e) => {
      e.preventDefault();
      isDragging = true;
      startX = e.clientX;
      startY = e.clientY;
      startOffX = offsetX;
      startOffY = offsetY;
    });

    const onMouseMove = (e) => {
      if (!isDragging) return;
      offsetX = startOffX + (e.clientX - startX);
      offsetY = startOffY + (e.clientY - startY);
      updateTransform();
    };
    const onMouseUp = () => { isDragging = false; };
    window.addEventListener('mousemove', onMouseMove);
    window.addEventListener('mouseup', onMouseUp);

    // 触摸
    viewport.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        isDragging = true;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        startOffX = offsetX;
        startOffY = offsetY;
      } else if (e.touches.length === 2) {
        isDragging = false;
        lastDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
      }
    }, { passive: true });

    viewport.addEventListener('touchmove', (e) => {
      if (e.touches.length === 1 && isDragging) {
        e.preventDefault();
        offsetX = startOffX + (e.touches[0].clientX - startX);
        offsetY = startOffY + (e.touches[0].clientY - startY);
        updateTransform();
      } else if (e.touches.length === 2) {
        e.preventDefault();
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        if (lastDist > 0) {
          scale *= dist / lastDist;
          scale = Math.max(0.5, Math.min(3, scale));
          slider.value = scale;
          updateTransform();
        }
        lastDist = dist;
      }
    }, { passive: false });

    viewport.addEventListener('touchend', () => {
      isDragging = false;
      lastDist = 0;
    });

    // 鼠标滚轮缩放
    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      scale += e.deltaY > 0 ? -0.05 : 0.05;
      scale = Math.max(0.5, Math.min(3, scale));
      slider.value = scale;
      updateTransform();
    });

    // 清理
    const cleanup = () => {
      window.removeEventListener('mousemove', onMouseMove);
      window.removeEventListener('mouseup', onMouseUp);
    };

    // 关闭
    const close = () => {
      cleanup();
      overlay.remove();
    };
    overlay.querySelector('.cropper-close').addEventListener('click', close);
    overlay.querySelector('.cropper-cancel').addEventListener('click', close);

    // 确认裁剪
    overlay.querySelector('.cropper-confirm').addEventListener('click', () => {
      cleanup();
      const vpW = viewport.clientWidth;
      const vpH = viewport.clientHeight;
      const mask = overlay.querySelector('.cropper-mask');
      // 使用遮罩實際大小而非固定正方形
      const maskW = mask ? parseFloat(mask.style.width) || mask.offsetWidth : Math.min(vpW, vpH) * 0.85;
      const maskH = mask ? parseFloat(mask.style.height) || mask.offsetHeight : Math.min(vpW, vpH) * 0.85;
      const cropSize = Math.min(maskW, maskH);
      const cropW = aspectRatio >= 1 ? cropSize : cropSize * aspectRatio;
      const cropH = cropSize / aspectRatio;

      const canvas = document.createElement('canvas');
      canvas.width = outputSize;
      canvas.height = Math.round(outputSize / aspectRatio);
      const ctx = canvas.getContext('2d');

      const imgW = imgNaturalW * scale;
      const imgH = imgNaturalH * scale;
      const imgLeft = (vpW - imgW) / 2 + offsetX;
      const imgTop = (vpH - imgH) / 2 + offsetY;
      const cropLeft = (vpW - cropW) / 2;
      const cropTop = (vpH - cropH) / 2;

      const srcX = (cropLeft - imgLeft) / scale;
      const srcY = (cropTop - imgTop) / scale;
      const srcW = cropW / scale;
      const srcH = cropH / scale;

      ctx.drawImage(img, srcX, srcY, srcW, srcH, 0, 0, outputSize, Math.round(outputSize / aspectRatio));
      const base64 = canvas.toDataURL('image/jpeg', 0.9);
      close();
      if (onCrop) onCrop(base64);
    });
  },

  /**
   * 卡片依次入场动画
   */
  animateCards(container, selector = '.card, .list-item', delay = 40) {
    const cards = container.querySelectorAll(selector);
    cards.forEach((card, i) => {
      card.style.animationDelay = `${i * delay}ms`;
      card.classList.add('card-stagger');
    });
  }
};
</script>
  <script>/* js/auth.js */
/* ===== 【我们的恋爱小宇宙】登录认证 - 纯前端版 ===== */

const Auth = {
  _passwords: {}, // { hash: { name, createdAt } }

  // 计算 SHA-256 hash
  _hash(pw) {
    // 使用 SubtleCrypto API
    const encoder = new TextEncoder();
    const data = encoder.encode(pw);
    return crypto.subtle.digest('SHA-256', data).then(buf => {
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    });
  },

  isLoggedIn() {
    return !!sessionStorage.getItem('love_token');
  },

  getToken() {
    return sessionStorage.getItem('love_token');
  },

  // 从 GitHub 拉取密码表
  async loadPasswords() {
    try {
      const { owner, repo, apiBase, token } = APP_CONFIG.github;
      const resp = await fetch(`${apiBase}/repos/${owner}/${repo}/contents/data/passwords.json`, {
        headers: {
          'Authorization': `token ${token}`,
          'Accept': 'application/vnd.github.v3+json'
        },
        cache: 'no-store'
      });
      if (!resp.ok) {
        // 没有密码文件，初始化
        this._passwords = {};
        return;
      }
      const item = await resp.json();
      const binary = atob(item.content);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      const decoded = new TextDecoder('utf-8').decode(bytes);
      const data = JSON.parse(decoded);
      this._passwords = data.passwords || {};
      return item.sha; // 返回 SHA 用于后续更新
    } catch (e) {
      console.warn('加载密码表失败:', e.message);
      this._passwords = {};
    }
  },

  // 登录：本地验证密码
  async login(password) {
    const hash = await this._hash(password);

    // 检查密码表
    const match = Object.entries(this._passwords).find(([, d]) => d.hash === hash);
    if (match) {
      sessionStorage.setItem('love_token', hash);
      sessionStorage.setItem('love_name', match[0]);
      // 记住最近登录的暗号（用于登录页显示合照等）
      localStorage.setItem('love_last_hash', hash.substring(0, 8));
      return { ok: true, name: match[0], hash };
    }
    return { ok: false, error: '暗号不对哦，再试一次吧 💕' };
  },

  // 注册新密码（写入 GitHub）
  async register(newPassword, confirmPassword) {
    if (newPassword !== confirmPassword) {
      return { ok: false, error: '两次输入的暗号不一致' };
    }
    if (newPassword.length < 4) {
      return { ok: false, error: '暗号至少需要4位' };
    }

    const hash = await this._hash(newPassword);

    // 检查是否重复
    for (const [name, d] of Object.entries(this._passwords)) {
      if (d.hash === hash) {
        return { ok: false, error: `这个暗号已经被使用了` };
      }
    }

    // 生成名称
    const name = `用户${Object.keys(this._passwords).length + 1}`;
    this._passwords[name] = { hash, createdAt: new Date().toISOString().slice(0, 10) };

    // 保存到 GitHub
    await this._savePasswords();

    return { ok: true, message: '新暗号注册成功！' };
  },

  // 修改密码
  async change(oldPassword, newPassword, newName) {
    if (newPassword.length < 4) {
      return { ok: false, error: '新暗号至少需要4位' };
    }

    const oldHash = await this._hash(oldPassword);
    const newHash = await this._hash(newPassword);

    // 找到旧密码
    const oldEntry = Object.entries(this._passwords).find(([, d]) => d.hash === oldHash);
    if (!oldEntry) {
      return { ok: false, error: '当前暗号不对' };
    }

    // 检查新暗号是否被使用
    for (const [n, d] of Object.entries(this._passwords)) {
      if (n !== oldEntry[0] && d.hash === newHash) {
        return { ok: false, error: '新暗号已被使用' };
      }
    }

    const name = newName || oldEntry[0];
    delete this._passwords[oldEntry[0]];
    this._passwords[name] = { hash: newHash, createdAt: oldEntry[1].createdAt };

    await this._savePasswords();

    // 清除旧登录态
    sessionStorage.removeItem('love_token');

    return { ok: true, message: '暗号修改成功！请用新暗号重新登录' };
  },

  // 保存密码表到 GitHub（带冲突合并）
  async _savePasswords() {
    try {
      const { owner, repo, apiBase, token } = APP_CONFIG.github;
      const branch = APP_CONFIG.github.branch;

      // 🔒 先重新拉取最新密码表（避免并发覆盖）
      let latestPasswords = { ...this._passwords };
      let sha = null;
      try {
        const resp = await fetch(`${apiBase}/repos/${owner}/${repo}/contents/data/passwords.json`, {
          headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' },
          cache: 'no-store'
        });
        if (resp.ok) {
          const item = await resp.json();
          sha = item.sha;
          const binary = atob(item.content);
          const bytes = new Uint8Array(binary.length);
          for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
          const decoded = new TextDecoder('utf-8').decode(bytes);
          const remoteData = JSON.parse(decoded);
          // 合并：远程 + 本地新增（不覆盖远程已有的）
          latestPasswords = { ...remoteData.passwords, ...this._passwords };
        }
      } catch (e) { /* 首次创建 */ }

      // 更新内存
      this._passwords = latestPasswords;

      const data = { passwords: latestPasswords };
      const content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));

      const body = {
        message: `🔐 更新密码表`,
        content,
        branch
      };
      if (sha) body.sha = sha;

      await fetch(`${apiBase}/repos/${owner}/${repo}/contents/data/passwords.json`, {
        method: 'PUT',
        headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
    } catch (e) {
      console.warn('保存密码表失败:', e.message);
    }
  },

  logout() {
    sessionStorage.removeItem('love_token');
    sessionStorage.removeItem('love_name');
    location.reload();
  },

  // ===== 页面渲染 =====
  renderLoginPage(container) {

    `;

    Components.showModal('注册新暗号', bodyHTML, async (overlay) => {
      const newPassword = overlay.querySelector('#form-new-pw').value.trim();
      const confirmPassword = overlay.querySelector('#form-confirm-pw').value.trim();

      if (!newPassword || !confirmPassword) { Utils.showToast('请填写完整'); return; }
      if (newPassword.length < 4) { Utils.showToast('新暗号至少需要4位'); return; }

      const result = await this.register(newPassword, confirmPassword);
      if (result.ok) {
        overlay.remove();
        Utils.showToast(result.message);
      } else {
        Utils.showToast(result.error);
      }
    });

  _bindLoginEvents(container) {
    const input = container.querySelector('#login-password');
    const btn = container.querySelector('#login-btn');
    const errorEl = container.querySelector('#login-error');

    let attempts = 0;

    const doLogin = async () => {
      const password = input.value.trim();
      if (!password) {
        errorEl.textContent = '请输入暗号';
        errorEl.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '验证中...';

      // 先加载密码表
      await this.loadPasswords();
      const result = await this.login(password);

      if (result.ok) {
        errorEl.style.display = 'none';
        const triggerInit = () => {
          if (typeof App !== 'undefined' && App.initAfterLogin) {
            App.initAfterLogin();
          } else {
            setTimeout(triggerInit, 50);
          }
        };
        triggerInit();
      } else {
        attempts++;
        errorEl.textContent = result.error;
        errorEl.style.display = 'block';
        btn.disabled = false;
        btn.innerHTML = `
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
          </svg>
          ${attempts >= 3 ? '等一下再试' : '再试一次'}
        `;

        if (attempts >= 3) {
          input.disabled = true;
          btn.disabled = true;
          setTimeout(() => {
            attempts = 0;
            input.disabled = false;
            btn.disabled = false;
            btn.innerHTML = `
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
              </svg>
              进入小宇宙
            `;
            errorEl.textContent = '试太多次了，等30秒再试吧';
          }, 30000);
        }
      }
    };

    btn.addEventListener('click', doLogin);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') doLogin();
    });

    setTimeout(() => input.focus(), 300);
    this._bindPhotoChange(container);
  },

  _bindPhotoChange(container) {
    const photo = container.querySelector('#login-couple-photo');
    const fileInput = container.querySelector('#login-photo-input');
    if (!photo || !fileInput) return;

    photo.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (!file) return;
      // 弹出裁剪器
      Components.showImageCropper(file, (base64) => {
        localStorage.setItem('love_couple_photo', base64);
        const img = photo.querySelector('img');
        if (img) img.src = base64;
        photo.classList.add('photo-updated');
        setTimeout(() => photo.classList.remove('photo-updated'), 500);
        if (typeof Store !== 'undefined' && Store.setCouplePhoto) {
          Store.setCouplePhoto(base64);
        }
      }, { aspectRatio: 1, outputSize: 400 });
      fileInput.value = '';
    });
  }
};

// 初始化所有 inspiration 的 createdAt
DEFAULT_INSPIRATION.forEach(i => { if (!i.createdAt) i.createdAt = Utils.getToday(); });

// ===== 数据仓库 - GitHub 同步版 =====
const Store = {
  data: {},
  _serverVersion: 0,
  _syncInProgress: false,
  _autoSaveTimeout: null,
  _initialized: false,

  // 初始化
  async init() {
    if (this._initialized) return;

    try {
      // 🔄 数据迁移：旧版 key（无暗号前缀）→ 新版 key（带暗号前缀）
      this._migrateFromLegacyKeys();

      // 🚀 先用本地数据立即渲染，GitHub 同步放到后台
      this.data = this._loadFromLocalStorage();
      if (!this.data.profile || !this.data.profile.togetherDate) {
        this._initDefaultData();
      }
      // 确保数据完整 + 自动生成内置纪念日
      this._ensureDefaults();
      this.saveAll();
      this._initialized = true;

      // 后台静默同步 GitHub（不阻塞渲染）
      this._backgroundSync();

      // 定期检查远程更新
      this._startPolling();
    } catch (e) {
      console.error('Store.init 异常:', e);
      // 兜底：用默认数据初始化，避免页面卡死
      this._initDefaultData();
      this._ensureDefaults();
      this._initialized = true;
      throw e; // 让 App 层决定是否回退登录页
    }
  },

  // 后台静默同步：拉取 GitHub 数据并合并
  async _backgroundSync() {
    try {
      const remoteData = await GitHubSync.initRepo();

      if (remoteData && remoteData.profile) {
        const localVersion = this.data._version || 0;
        const remoteVersion = remoteData._version || 0;

        // 如果远程数据没有版本号（旧格式），先推送本地数据赋予版本号
        if (!remoteData._version) {
          this._schedulePush();
          return;
        }

        if (remoteVersion > localVersion) {
          // 远程版本更新，静默合并（对方做了修改）
          // 保留本地手动添加的纪念日（非 auto_ 前缀）
          const manualAnniversaries = (this.data.anniversaries || []).filter(
            a => !a.id || !a.id.startsWith('auto_')
          );
          this.data = remoteData;
          // 合并：远程内置 + 本地手动
          this.data.anniversaries = [
            ...(remoteData.anniversaries || []).filter(a => a.id && a.id.startsWith('auto_')),
            ...manualAnniversaries
          ];
          this._ensureDefaults();
          this._syncInspirationPool(remoteData);
          this.saveAll();
          console.log('📥 后台同步完成 v' + remoteVersion);
          if (typeof App !== 'undefined' && App.currentPage === 'dashboard') {
            App.refresh();
          }
        } else if (remoteVersion < localVersion) {
          // 本地更新，推送到 GitHub
          this._schedulePush();
        }
        // remoteVersion === localVersion: 无需操作，本地数据优先
      } else if (!remoteData) {
        // 首次使用，推送本地数据
        await GitHubSync.push(this.data);
        console.log('✅ 初始数据已上传 GitHub');
      }
    } catch (e) {
      console.warn('后台同步失败（不影响使用）:', e.message);
    }
  },

  _initDefaultData() {
    this.data = {
      profile: { ...DEFAULT_PROFILE },
      anniversaries: [],
      travels: [],
      foods: [],
      shopping: [],
      ledger: [],
      inspiration: [...DEFAULT_INSPIRATION]
    };
  },

  // 确保关键集合不为空（远程数据可能不完整）
  _ensureDefaults() {
    const defaultMap = {
      profile: { ...DEFAULT_PROFILE },
      inspiration: [...DEFAULT_INSPIRATION],
      anniversaries: [],
      travels: [],
      foods: [],
      shopping: [],
      ledger: []
    };
    for (const [key, fallback] of Object.entries(defaultMap)) {
      if (!this.data[key] || (Array.isArray(this.data[key]) && this.data[key].length === 0 && fallback.length > 0)) {
        // 数组为空时用默认值填充（仅针对有默认数据的集合）
        if (Array.isArray(this.data[key]) && this.data[key].length === 0 && fallback.length > 0) {
          this.data[key] = [...fallback];
          console.log(`📦 已补充默认${key}数据 (${fallback.length}条)`);
        } else if (!this.data[key]) {
          this.data[key] = fallback;
        }
      }
    }
    // 自动生成内置纪念日
    this._ensureBuiltinAnniversaries();
  },

  // 基于在一起日期自动生成内置纪念日（100天、周年、节日等）
  _ensureBuiltinAnniversaries() {
    const together = this.data.profile?.togetherDate;
    if (!together) return;

    const togetherDate = new Date(together + 'T00:00:00');
    if (isNaN(togetherDate.getTime())) return;

    // 检测 togetherDate 是否变化
    const prefix = _getPasscodePrefix();
    const lastTogether = localStorage.getItem(prefix + 'builtin_together_date');
    if (lastTogether && lastTogether !== together) {
      this.data.anniversaries = (this.data.anniversaries || []).filter(
        a => !a.id || !a.id.startsWith('auto_')
      );
      console.log('🔄 在一起日期已变更，重新生成内置纪念日');
    }
    localStorage.setItem(prefix + 'builtin_together_date', together);

    // 检查版本号，版本升级时重新生成
    const BUILTIN_VERSION = 3;
    const lastVersion = parseInt(localStorage.getItem(prefix + 'builtin_version') || '0', 10);
    if (lastVersion < BUILTIN_VERSION) {
      this.data.anniversaries = (this.data.anniversaries || []).filter(
        a => !a.id || !a.id.startsWith('auto_')
      );
      console.log('🔄 内置纪念日版本升级，重新生成');
    }
    localStorage.setItem(prefix + 'builtin_version', BUILTIN_VERSION);

    const today = new Date();
    today.setHours(0, 0, 0, 0);

    // 已有的内置纪念日 ID（不重复创建）
    const existingIds = new Set((this.data.anniversaries || []).map(a => a.id));
    const existingDates = new Set((this.data.anniversaries || []).map(a => a.date));

    const builtins = [];

    // 工具函数：从在一起日期加 N 天
    const addDays = (date, n) => {
      const d = new Date(date);
      d.setDate(d.getDate() + n);
      return d;
    };

    // 格式化日期 YYYY-MM-DD
    const fmt = (d) => {
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    };

    // 计算天数差
    const daysBetween = (d1, d2) => Math.round((d2 - d1) / 86400000);

    // ===== 1. 日纪念日：仅 100 天 =====
    const dayMilestones = [
      { days: 100, label: '💯 100天纪念日' }
    ];

    for (const m of dayMilestones) {
      const date = addDays(togetherDate, m.days);
      // 只添加未来的纪念日
      if (date >= today) {
        const id = `auto_days_${m.days}`;
        const dateStr = fmt(date);
        if (!existingIds.has(id) && !existingDates.has(dateStr)) {
          builtins.push({
            id,
            name: m.label,
            date: dateStr,
            repeatCycle: 'single',
            remindDays: 7,
            status: 'active'
          });
        }
      }
    }

    // ===== 2. 周年纪念日（1-10年） =====
    for (let yr = 1; yr <= 10; yr++) {
      const annivDate = new Date(togetherDate);
      annivDate.setFullYear(annivDate.getFullYear() + yr);
      if (annivDate >= today) {
        const id = `auto_year_${yr}`;
        const dateStr = fmt(annivDate);
        if (!existingIds.has(id) && !existingDates.has(dateStr)) {
          builtins.push({
            id,
            name: yr === 1 ? '一周年纪念日 ❤️' : `${yr}周年纪念日`,
            date: dateStr,
            repeatCycle: 'single',
            remindDays: 14,
            status: 'active'
          });
        }
      }
    }

    // ===== 3. 常见节日节点 =====
    // 情人节（每年2月14日）
    for (let y = today.getFullYear(); y <= today.getFullYear() + 3; y++) {
      const valentine = new Date(y, 1, 14); // 2月14日
      if (valentine >= today && valentine > togetherDate) {
        const id = `auto_valentine_${y}`;
        const dateStr = fmt(valentine);
        if (!existingIds.has(id) && !existingDates.has(dateStr)) {
          builtins.push({
            id,
            name: y === today.getFullYear() && valentine >= today ? '💝 情人节' : `${y}年情人节`,
            date: dateStr,
            repeatCycle: 'yearly',
            remindDays: 7,
            status: 'active'
          });
        }
        break; // 每年重复，只需加一次
      }
    }

    // 520（每年5月20日）
    for (let y = today.getFullYear(); y <= today.getFullYear() + 3; y++) {
      const wuerling = new Date(y, 4, 20);
      if (wuerling >= today && wuerling > togetherDate) {
        const id = `auto_520_${y}`;
        const dateStr = fmt(wuerling);
        if (!existingIds.has(id) && !existingDates.has(dateStr)) {
          builtins.push({
            id,
            name: '💌 520',
            date: dateStr,
            repeatCycle: 'yearly',
            remindDays: 7,
            status: 'active'
          });
        }
        break;
      }
    }

    // 七夕（2026=8/19, 2027=8/8, 2028=8/26）
    const qixiDates = { 2026: '08-19', 2027: '08-08', 2028: '08-26' };
    for (let y = today.getFullYear(); y <= today.getFullYear() + 3; y++) {
      if (qixiDates[y]) {
        const qxDate = new Date(`${y}-${qixiDates[y]}T00:00:00`);
        if (qxDate >= today && qxDate > togetherDate) {
          const id = `auto_qixi_${y}`;
          const dateStr = fmt(qxDate);
          if (!existingIds.has(id) && !existingDates.has(dateStr)) {
            builtins.push({
              id,
              name: '🎋 七夕',
              date: dateStr,
              repeatCycle: 'yearly',
              remindDays: 10,
              status: 'active'
            });
          }
          break;
        }
      }
    }

    // 圣诞节（每年12月25日）
    for (let y = today.getFullYear(); y <= today.getFullYear() + 3; y++) {
      const christmas = new Date(y, 11, 25);
      if (christmas >= today && christmas > togetherDate) {
        const id = `auto_christmas_${y}`;
        const dateStr = fmt(christmas);
        if (!existingIds.has(id) && !existingDates.has(dateStr)) {
          builtins.push({
            id,
            name: '🎄 圣诞节',
            date: dateStr,
            repeatCycle: 'yearly',
            remindDays: 14,
            status: 'active'
          });
        }
        break;
      }
    }

    // 跨年夜（每年12月31日）
    for (let y = today.getFullYear(); y <= today.getFullYear() + 3; y++) {
      const newYearEve = new Date(y, 11, 31);
      if (newYearEve >= today && newYearEve > togetherDate) {
        const id = `auto_newyear_${y}`;
        const dateStr = fmt(newYearEve);
        if (!existingIds.has(id) && !existingDates.has(dateStr)) {
          builtins.push({
            id,
            name: '🎆 跨年夜',
            date: dateStr,
            repeatCycle: 'yearly',
            remindDays: 7,
            status: 'active'
          });
        }
        break;
      }
    }

    if (builtins.length > 0) {
      // 按日期排序
      builtins.sort((a, b) => a.date.localeCompare(b.date));
      this.data.anniversaries = [...(this.data.anniversaries || []), ...builtins];
      console.log(`📅 已自动生成 ${builtins.length} 个内置纪念日`);
    }
  },

  // 从远程数据同步灵感池（支持远程更新推送新内容）
  _syncInspirationPool(remoteData) {
    if (remoteData && remoteData._inspirationPool && remoteData._inspirationPool.length > 0) {
      const remotePool = remoteData._inspirationPool;
      // 用远程灵感池替换本地默认数据（但保留用户自己添加的条目）
      const userItems = (this.data.inspiration || []).filter(
        i => !i.id || !i.id.startsWith('insp_')
      );
      this.data.inspiration = [...remotePool, ...userItems];
      console.log(`📦 灵感池已同步: ${remotePool.length}条远程 + ${userItems.length}条自定义`);
    }
  },

  /**
   * 从旧版 key 迁移到新版 key
   * 迁移只发生一次（全局标记），给第一个登录的暗号
   * 后续暗号不会拿到旧数据，保证隔离
   */
  _migrateFromLegacyKeys() {
    // 全局迁移标记：只迁移一次
    const GLOBAL_MIGRATED = 'love_migration_done_global_v2';
    if (localStorage.getItem(GLOBAL_MIGRATED)) return;

    const prefix = _getPasscodePrefix();
    const profileKey = prefix + 'profile';

    // 如果当前暗号已经有新 key 数据（从 GitHub 同步来），跳过迁移
    if (localStorage.getItem(profileKey)) {
      localStorage.setItem(GLOBAL_MIGRATED, '1');
      return;
    }

    const legacyKeys = [
      'love_profile', 'love_anniversaries', 'love_travels', 'love_foods',
      'love_shopping', 'love_ledger', 'love_inspiration'
    ];

    let migrated = false;
    for (const legacyKey of legacyKeys) {
      const data = localStorage.getItem(legacyKey);
      if (data !== null) {
        const suffix = legacyKey.replace('love_', '');
        const newKey = prefix + suffix;
        if (!localStorage.getItem(newKey)) {
          localStorage.setItem(newKey, data);
          migrated = true;
        }
      }
    }

    // 迁移辅助 key
    const auxLegacy = [
      ['love_data_version', prefix + 'data_version'],
      ['love_builtin_together_date', prefix + 'builtin_together_date'],
      ['love_builtin_version', prefix + 'builtin_version'],
      ['love_couple_photo', prefix + 'couple_photo']
    ];
    for (const [oldKey, newKey] of auxLegacy) {
      const data = localStorage.getItem(oldKey);
      if (data !== null && !localStorage.getItem(newKey)) {
        localStorage.setItem(newKey, data);
        migrated = true;
      }
    }

    if (migrated) {
      console.log('🔄 数据已从旧格式迁移到暗号隔离存储');
    }
    // 全局标记：只迁移一次
    localStorage.setItem(GLOBAL_MIGRATED, '1');
  },

  _loadFromLocalStorage() {
    const keys = _getStoreKeys();
    const data = {
      profile: Utils.loadFromStorage(keys.profile, { ...DEFAULT_PROFILE }),
      anniversaries: Utils.loadFromStorage(keys.anniversaries, []),
      travels: Utils.loadFromStorage(keys.travels, []),
      foods: Utils.loadFromStorage(keys.foods, []),
      shopping: Utils.loadFromStorage(keys.shopping, []),
      ledger: Utils.loadFromStorage(keys.ledger, []),
      inspiration: Utils.loadFromStorage(keys.inspiration, [...DEFAULT_INSPIRATION])
    };
    // 恢复版本号
    const savedVersion = localStorage.getItem(_getPasscodePrefix() + 'data_version');
    if (savedVersion) data._version = parseInt(savedVersion, 10);
    return data;
  },

  // 定期轮询检查对方更新（每30秒）
  _startPolling() {
    setInterval(async () => {
      try {
        const remote = await GitHubSync.pull();
        if (remote && remote._version > (this.data._version || 0)) {
          const localVersion = this.data._version || 0;
          // 保留本地手动纪念日
          const manualAnniversaries = (this.data.anniversaries || []).filter(
            a => !a.id || !a.id.startsWith('auto_')
          );
          this.data = remote;
          this.data.anniversaries = [
            ...(remote.anniversaries || []).filter(a => a.id && a.id.startsWith('auto_')),
            ...manualAnniversaries
          ];
          this.saveAll();
          console.log('🔄 检测到TA的更新 v' + remote._version);
          if (localVersion > 0) {
            Utils.showToast('TA的数据已同步 ✨');
            // 触发页面刷新
            if (typeof App !== 'undefined' && App.refresh) {
              App.refresh();
            }
          }
        }
      } catch (e) { /* ignore */ }
    }, 30000);
  },

  // 同步到 GitHub
  async syncToGitHub() {
    if (this._syncInProgress) return;
    this._syncInProgress = true;
    try {
      const ok = await GitHubSync.push(this.data);
      if (ok) {
        this._serverVersion = this.data._version || 0;
      }
    } catch (e) {
      console.warn('GitHub 同步失败:', e.message);
    } finally {
      this._syncInProgress = false;
    }
  },

  _schedulePush() {
    if (this._autoSaveTimeout) clearTimeout(this._autoSaveTimeout);
    this._autoSaveTimeout = setTimeout(() => {
      this.syncToGitHub();
    }, 1000);
  },

  saveAll() {
    const keys = _getStoreKeys();
    Object.entries(keys).forEach(([key, storageKey]) => {
      Utils.saveToStorage(storageKey, this.data[key]);
    });
    // 持久化版本号，防止后台同步时被旧远程数据覆盖
    if (this.data._version) {
      localStorage.setItem(_getPasscodePrefix() + 'data_version', this.data._version);
    }
  },

  // ===== 数据访问 =====
  getProfile() { return this.data.profile; },
  getAnniversaries() { return this.data.anniversaries; },
  getTravels() { return this.data.travels; },
  getFoods() { return this.data.foods; },
  getShopping() { return this.data.shopping; },
  getLedger() { return this.data.ledger; },
  getInspiration() { return this.data.inspiration; },

  updateProfile(updates) {
    this.data.profile = { ...this.data.profile, ...updates };
    this.saveAll();
    this._schedulePush();
  },

  add(collection, item) {
    item.id = Utils.generateId();
    item.createdAt = item.createdAt || Utils.getToday();
    this.data[collection].push(item);
    this.saveCollection(collection);
    this._schedulePush();
    return item;
  },

  update(collection, id, updates) {
    const idx = this.data[collection].findIndex(i => i.id === id);
    if (idx === -1) return false;
    this.data[collection][idx] = { ...this.data[collection][idx], ...updates };
    this.saveCollection(collection);
    this._schedulePush();
    return true;
  },

  remove(collection, id) {
    const idx = this.data[collection].findIndex(i => i.id === id);
    if (idx === -1) return false;
    this.data[collection].splice(idx, 1);
    this.saveCollection(collection);
    this._schedulePush();
    return true;
  },

  getById(collection, id) {
    return this.data[collection].find(i => i.id === id) || null;
  },

  saveCollection(collection) {
    const keys = _getStoreKeys();
    Utils.saveToStorage(keys[collection], this.data[collection]);
  },

  getUpcomingAnniversaries(limit = 3) {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    return (this.data.anniversaries || [])
      .filter(a => a.status !== 'completed')
      .map(a => {
        const nextDate = Utils.getNextAnniversaryDate(a);
        const daysUntil = Utils.getDaysUntil(nextDate);
        return { ...a, nextDate: Utils.formatDate(nextDate), daysUntil };
      })
      .filter(a => a.daysUntil >= 0)
      .sort((a, b) => a.daysUntil - b.daysUntil)
      .slice(0, limit);
  },

  getRemindAnniversaries() {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    return (this.data.anniversaries || [])
      .filter(a => a.status !== 'completed' && a.remindDays > 0)
      .map(a => {
        const nextDate = Utils.getNextAnniversaryDate(a);
        const daysUntil = Utils.getDaysUntil(nextDate);
        return { ...a, nextDate: Utils.formatDate(nextDate), daysUntil };
      })
      .filter(a => a.daysUntil >= 0 && a.daysUntil <= a.remindDays)
      .sort((a, b) => a.daysUntil - b.daysUntil);
  },

  getLedgerMonthlySummary(year, month) {
    const items = Utils.filterByMonth(this.data.ledger || [], year, month);
    const total = items.reduce((sum, i) => sum + Number(i.amount), 0);
    const categorySummary = Utils.categorySummary(items);
    const hisTotal = items.filter(i => i.payer === '他').reduce((s, i) => s + Number(i.amount), 0);
    const herTotal = items.filter(i => i.payer === '她').reduce((s, i) => s + Number(i.amount), 0);
    return { year, month, total, categorySummary, hisTotal, herTotal, count: items.length };
  },

  getLedgerRecentMonths(months = 6) {
    const result = [];
    const now = new Date();
    for (let i = months - 1; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      result.push(this.getLedgerMonthlySummary(d.getFullYear(), d.getMonth()));
    }
    return result;
  },

  getCouplePhoto() {
    if (this.data.profile && this.data.profile.couplePhoto) {
      return this.data.profile.couplePhoto;
    }

  _bindPhotoChange() {
    const photo = document.getElementById('hero-couple-photo');
    const input = document.getElementById('hero-photo-input');

    photo.addEventListener('click', () => input.click());

    input.addEventListener('change', () => {
      const file = input.files[0];
      if (!file) return;
      // 弹出裁剪器
      Components.showImageCropper(file, (base64) => {
        Store.setCouplePhoto(base64);
        const img = photo.querySelector('img');
        if (img) img.src = base64;
        photo.classList.add('photo-updated');
        setTimeout(() => photo.classList.remove('photo-updated'), 500);
        Utils.showToast('合照已更新');
      }, { aspectRatio: 1, outputSize: 400 });
      input.value = ''; // 清空 input 以便重复选择同一文件
    });

  _bindSettingsBtn() {
    const btn = document.getElementById('btn-change-password');
    if (btn) {
      btn.addEventListener('click', () => Auth._showPasswordChange());
    }

  _bindCounterEdit() {
    const counter = document.querySelector('.love-counter');
    if (counter) {
      counter.addEventListener('click', () => {
        this._showProfileEdit();
      });
    }
  },

  _showProfileEdit() {
    const profile = Store.getProfile();
    const bodyHTML = `
      <div class="input-group">
        <label class="input-label">在一起日期</label>
        <input class="input" type="date" id="form-date" value="${profile.togetherDate}">

        <div class="input-group flex-1">
          <label class="input-label">TA的昵称</label>
          <input class="input" id="form-nickname-a" value="${profile.nicknameA}" placeholder="例如：小宇宙">

        <div class="input-group flex-1">
          <label class="input-label">你的昵称</label>
          <input class="input" id="form-nickname-b" value="${profile.nicknameB}" placeholder="例如：小星星">
        </div>
      </div>
      <div class="input-group">
        <label class="input-label">恋爱宣言</label>
        <textarea class="input" id="form-declaration" placeholder="写下你们的恋爱宣言...">${profile.declaration}</textarea>
      </div>
    `;

    Components.showModal('编辑恋爱档案', bodyHTML, (overlay) => {
      const updates = {
        togetherDate: overlay.querySelector('#form-date').value,
        nicknameA: overlay.querySelector('#form-nickname-a').value.trim() || '小宇宙',
        nicknameB: overlay.querySelector('#form-nickname-b').value.trim() || '小星星',
        declaration: overlay.querySelector('#form-declaration').value.trim()
      };

      if (!updates.togetherDate) {
        Utils.showToast('请选择在一起日期');
        return;
      }

      Store.updateProfile(updates);
      overlay.remove();
      App.render();
      Utils.showToast('恋爱档案已更新');
    });
  }
};
</script>
  <script>/* js/pages/timeline.js */
/* ===== 【我们的恋爱小宇宙】纪念日页面 ===== */
const TimelinePage = {
  filter: 'all', // all | active | completed

  render(container) {
    this.container = container;
    const anniversaries = Store.getAnniversaries();
    const filtered = this.filter === 'all'
      ? anniversaries
      : anniversaries.filter(a => a.status === this.filter);

    // 排序：按下次日期
    const sorted = [...filtered].map(a => {
      const nextDate = Utils.getNextAnniversaryDate(a);
      const daysUntil = Utils.getDaysUntil(nextDate);
      return { ...a, nextDate: Utils.formatDate(nextDate), daysUntil };
    }).sort((a, b) => {
      if (a.status === 'active' && b.status !== 'active') return -1;
      if (a.status !== 'active' && b.status === 'active') return 1;
      return a.daysUntil - b.daysUntil;
    });

    container.innerHTML = `
      ${this._renderHeader()}
      ${this._renderFilters()}
      <div class="page-content" style="padding-top:0">
        <div id="timeline-list">
          ${this._renderList(sorted)}
        </div>
      </div>
      <button class="btn-fab" id="add-anniversary-btn">+</button>
    `;

    this._bindEvents();
    Components.animateCards(this.container, '.timeline-card');
  },

  _renderHeader() {
    const activeCount = Store.getAnniversaries().filter(a => a.status === 'active').length;
    return `
      <div class="page-header">
        <div style="display:flex;align-items:center;gap:var(--space-md)">
          <div style="width:4px;height:24px;background:var(--color-timeline);border-radius:2px"></div>
          <div>
            <h2 class="page-header-title">纪念日清单</h2>
            <p class="page-header-subtitle">${activeCount}个进行中 · 珍惜每一个值得纪念的日子</p>
          </div>
        </div>
      </div>
    `;
  },

  _renderFilters() {
    const tabs = [
      { id: 'all', label: '全部' },
      { id: 'active', label: '进行中' },
      { id: 'completed', label: '已完成' }
    ];
    const tabsHTML = tabs.map(t => `
      <button class="filter-tab ${this.filter === t.id ? 'active' : ''}" data-filter="${t.id}">${t.label}</button>
    `).join('');
    return `<div class="filter-tabs">${tabsHTML}</div>`;
  },

  _renderList(items) {
    if (items.length === 0) {
      return `
        <div class="empty-state">
          <div class="empty-icon">📅</div>
          <div class="empty-title">暂无纪念日</div>
          <div class="empty-desc">点击右下角 + 添加你们的专属纪念日</div>
        </div>
      `;
    }

    return items.map(a => {
      const dateObj = new Date(a.nextDate || a.date);
      const month = dateObj.getMonth() + 1;
      const day = dateObj.getDate();
      const statusTag = a.status === 'completed'
        ? '<span class="tag tag-success">已完成</span>'
        : a.daysUntil <= 3
          ? '<span class="tag tag-warning">临近</span>'
          : '<span class="tag tag-timeline">进行中</span>';

      const daysText = a.status === 'completed'
        ? '已完成'
        : a.daysUntil === 0 ? '今天' : a.daysUntil === 1 ? '明天' : `还有${a.daysUntil}天`;

      const repeatLabel = a.repeatCycle === 'yearly' ? '每年' : '单次';

      return `
        <div class="card card-hoverable card-accent-timeline mb-base" data-id="${a.id}">
          <div class="card-header">
            <div class="flex items-center gap-md">
              <div style="text-align:center;min-width:40px">
                <div style="font-family:var(--font-sans);font-size:var(--text-lg);font-weight:var(--weight-bold);color:var(--color-timeline);line-height:1">${String(day).padStart(2,'0')}</div>
                <div style="font-size:var(--text-xs);color:var(--text-muted)">${month}月</div>
              </div>
              <div>
                <div class="card-title">${a.name}</div>
                <div class="card-subtitle">${repeatLabel}重复 · 提前${a.remindDays}天提醒</div>
              </div>
            </div>
            ${statusTag}
          </div>
          <div class="card-body">
            <span style="color:var(--color-timeline);font-weight:var(--weight-medium)">${daysText}</span>
          </div>
        </div>
      `;
    }).join('');
  },

  _bindEvents() {
    // 筛选标签
    this.container.querySelectorAll('.filter-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        this.filter = tab.dataset.filter;
        this.render(this.container);
      });
    });

    // 添加按钮
    this.container.querySelector('#add-anniversary-btn').addEventListener('click', () => {
      this._showForm();
    });

    // 卡片点击
    this.container.querySelectorAll('.card[data-id]').forEach(card => {
      card.addEventListener('click', () => {
        const id = card.dataset.id;
        const item = Store.getById('anniversaries', id);
        if (item) this._showForm(item);
      });
    });
  },

  _showForm(item = null) {
    const isEdit = !!item;
    const title = isEdit ? '编辑纪念日' : '添加纪念日';
    const data = item || { name: '', date: '', repeatCycle: 'yearly', remindDays: 7, status: 'active' };

    const bodyHTML = `
      <div class="input-group">
        <label class="input-label">纪念日名称</label>
        <input class="input" id="form-name" value="${data.name}" placeholder="例如：在一起纪念日">
      </div>
      <div class="input-group">
        <label class="input-label">日期</label>
        <input class="input" type="date" id="form-date" value="${data.date}">
      </div>
      <div class="input-group">
        <label class="input-label">重复周期</label>
        <select class="input" id="form-repeat">
          <option value="yearly" ${data.repeatCycle === 'yearly' ? 'selected' : ''}>每年重复</option>
          <option value="single" ${data.repeatCycle === 'single' ? 'selected' : ''}>仅此一次</option>
        </select>
      </div>
      <div class="input-group">
        <label class="input-label">提前提醒天数</label>
        <input class="input" type="number" id="form-remind" value="${data.remindDays}" min="0" max="30">
      </div>
      <div class="input-group">
        <label class="input-label">状态</label>
        <select class="input" id="form-status">
          <option value="active" ${data.status === 'active' ? 'selected' : ''}>进行中</option>
          <option value="completed" ${data.status === 'completed' ? 'selected' : ''}>已完成</option>
        </select>
      </div>
    `;

    Components.showModal(title, bodyHTML, (overlay) => {
      const updates = {
        name: overlay.querySelector('#form-name').value.trim(),
        date: overlay.querySelector('#form-date').value,
        repeatCycle: overlay.querySelector('#form-repeat').value,
        remindDays: parseInt(overlay.querySelector('#form-remind').value) || 7,
        status: overlay.querySelector('#form-status').value
      };

      if (!updates.name || !updates.date) {
        Utils.showToast('请填写名称和日期');
        return;
      }

      if (isEdit) {
        Store.update('anniversaries', item.id, updates);
      } else {
        Store.add('anniversaries', updates);
      }
      overlay.remove();
      this.render(this.container);
      Utils.showToast(isEdit ? '已更新' : '已添加');
    });
  }
};
</script>

  _renderList(items) {

        const tagClass = tag === '想去' ? 'tag-outline' : 'tag-primary';
        return `<span class="tag ${tagClass}">${tag}</span>`;

              </div>
              ${t.notes ? `<div class="text-xs text-muted mt-sm" style="line-height:1.5">${t.notes.substring(0, 60)}${t.notes.length > 60 ? '...' : ''}</div>` : ''}
              ${photos.length > 1 ? `<div class="text-xs text-muted mt-sm">📷 ${photos.length}张照片</div>` : ''}
            </div>
          </div>
        </div>
      `;
    }).join('');
  },

  _bindEvents() {
    this.container.querySelectorAll('.filter-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        this.filter = tab.dataset.filter;
        this.render(this.container);
      });
    });

    this.container.querySelector('#add-travel-btn').addEventListener('click', () => {
      this._showForm();
    });

  _showForm(item = null) {
    const isEdit = !!item;
    const title = isEdit ? '编辑旅行记录' : '添加旅行记录';
    const data = item || {
      location: '', startDate: '', endDate: '', itinerary: '',
      photos: [], cost: 0, notes: '', tags: ['已打卡']
    };

    const photos = data.photos || [];
    const photosPreview = photos.map((p, i) => `
      <div style="position:relative;display:inline-block;margin-right:8px;margin-bottom:8px">
        <img src="${p}" style="width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--border-light)">
        <button class="photo-remove-btn" data-idx="${i}" style="position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--text-primary);color:#fff;border:none;font-size:12px;line-height:1;cursor:pointer">×</button>
      </div>

    const tagsOptions = ['已打卡', '想去', '浪漫', '海边', '自然风光', '美食', '城市', '海外', '文化', '极光'];
    const tagsHTML = tagsOptions.map(tag => {
      const checked = (data.tags || []).includes(tag) ? 'checked' : '';
      return `
        <label style="display:inline-flex;align-items:center;gap:4px;margin-right:12px;margin-bottom:8px;cursor:pointer;font-size:var(--text-sm);color:var(--text-secondary)">
          <input type="checkbox" value="${tag}" ${checked} style="accent-color:var(--text-primary)"> ${tag}
        </label>
      `;
    }).join('');

      <div class="input-group">
        <label class="input-label">地点</label>

          <label class="input-label">结束日期</label>
          <input class="input" type="date" id="form-end" value="${data.endDate}">
        </div>
      </div>
      <div class="input-group">
        <label class="input-label">行程攻略</label>

        <input class="input" type="number" id="form-cost" value="${data.cost}" placeholder="0">

        <label class="input-label">个人感想</label>

          <label id="photo-upload-label" style="display:inline-flex;align-items:center;justify-content:center;width:64px;height:64px;border:2px dashed var(--border-color);border-radius:8px;cursor:pointer;transition:all var(--transition-fast)">
            <span style="font-size:24px;color:var(--text-muted)">+</span>
            <input type="file" id="photo-file-input" accept="image/*" multiple style="display:none">
          </label>
          <div id="photos-preview" style="display:flex;flex-wrap:wrap;gap:8px">${photosPreview}</div>
        </div>
        <input type="hidden" id="form-photos-json" value='${JSON.stringify(photos)}'>
      </div>
      <div class="input-group">
        <label class="input-label">标签</label>
        <div style="padding-top:4px">${tagsHTML}</div>
      </div>
    `;

      let currentPhotos = [];
      try { currentPhotos = JSON.parse(hiddenInput.value); } catch(e) {}
      previewDiv.innerHTML = currentPhotos.map((p, i) => `
        <div style="position:relative;display:inline-block">

        </div>
      `).join('');

        btn.addEventListener('click', () => {
          let photos = JSON.parse(hiddenInput.value);
          photos.splice(parseInt(btn.dataset.idx), 1);
          hiddenInput.value = JSON.stringify(photos);
          refreshPhotos();
        });
      });
    };

      const files = Array.from(fileInput.files);
      if (files.length === 0) return;
      let photos = JSON.parse(hiddenInput.value);
      let loaded = 0;
      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = (e) => {
          photos.push(e.target.result);
          loaded++;
          if (loaded === files.length) {
            hiddenInput.value = JSON.stringify(photos);
            refreshPhotos();
          }
        };
        reader.readAsDataURL(file);
      });
      fileInput.value = '';
    });
  }
};
</script>
