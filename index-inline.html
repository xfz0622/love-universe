/* ===== 【我们的恋爱小宇宙】购物待办页面 ===== */
const ShoppingPage = {
  filter: 'all',

  render(container) {
    this.container = container;
    const items = Store.getShopping();
    const filtered = this.filter === 'all' ? items : items.filter(s => s.status === this.filter);

    const sorted = [...filtered].sort((a, b) => {
      const order = { pending: 0, ordered: 1, completed: 2 };
      if (order[a.status] !== order[b.status]) return order[a.status] - order[b.status];
      if (a.deadline && b.deadline) return new Date(a.deadline) - new Date(b.deadline);
      return 0;
    });

    container.innerHTML = `
      ${this._renderHeader()}
      ${this._renderFilters()}
      <div class="page-content" style="padding-top:0">
        <div id="shopping-list">
          ${this._renderList(sorted)}
        </div>
      </div>
      <button class="btn-fab" id="add-shopping-btn">+</button>
    `;

    this._bindEvents();
    Components.animateCards(this.container, '.card');
  },

  _renderHeader() {
    const pending = Store.getShopping().filter(s => s.status === 'pending').length;
    const total = Store.getShopping().reduce((s, item) => s + Number(item.budget || 0), 0);
    return `
      <div class="page-header">
        <div style="display:flex;align-items:center;gap:var(--space-md)">
          <div style="width:4px;height:24px;background:var(--text-primary);border-radius:2px"></div>
          <div>
            <h2 class="page-header-title">购物待办</h2>
            <p class="page-header-subtitle">${pending}项待选购 · 预算总计${Utils.formatMoney(total)}</p>
          </div>
        </div>
      </div>
    `;
  },

  _renderFilters() {
    const tabs = [
      { id: 'all', label: '全部' },
      { id: 'pending', label: '待选购' },
      { id: 'ordered', label: '已下单' },
      { id: 'completed', label: '已完成' }
    ];
    const tabsHTML = tabs.map(t => `
      <button class="filter-tab ${this.filter === t.id ? 'active' : ''}" data-filter="${t.id}">${t.label}</button>
    `).join('');
    return `<div class="filter-tabs">${tabsHTML}</div>`;
  },

  _renderList(items) {
    if (items.length === 0) {
      return `
        <div class="empty-state">
          <div class="empty-icon">🛒</div>
          <div class="empty-title">暂无待办</div>
          <div class="empty-desc">添加你们的购物清单</div>
        </div>
      `;
    }

    return items.map(s => {
      const statusMap = {
        pending: { label: '待选购', cls: 'tag-outline' },
        ordered: { label: '已下单', cls: 'tag-warning' },
        completed: { label: '已完成', cls: 'tag-success' }
      };
      const st = statusMap[s.status];
      const isCompleted = s.status === 'completed';
      const deadlineText = s.deadline
        ? `截止：${Utils.formatDateShort(s.deadline)}`
        : '无截止日期';

      const daysLeft = s.deadline ? Utils.daysBetween(Utils.getToday(), s.deadline) : null;
      const urgentClass = daysLeft !== null && daysLeft <= 7 && s.status === 'pending' ? 'tag-danger' : '';

      // 链接跳转按钮
      let linkBtn = '';
      if (s.link && s.link.trim()) {
        const platform = ShoppingPage._detectPlatform(s.link);
        linkBtn = `
          <button class="btn btn-sm btn-primary" style="margin-top:6px;font-size:11px;padding:3px 10px" onclick="event.stopPropagation();ShoppingPage._openLink('${s.link.replace(/'/g, "\\'")}')">
            🔗 ${platform}购买
          </button>
        `;
      }

      return `
        <div class="todo-item ${isCompleted ? 'checked' : ''}" data-id="${s.id}">
          <button class="todo-check ${isCompleted ? 'checked' : ''}"></button>
          <div class="todo-content">
            <div class="todo-text">${s.name}</div>
            <div class="todo-meta">
              ${s.purpose ? `${s.purpose} · ` : ''}${Utils.formatMoney(s.budget)}
              ${s.deadline ? ` · ${deadlineText}` : ''}
              ${daysLeft !== null && daysLeft <= 7 && s.status === 'pending' ? `<span class="tag ${urgentClass}" style="margin-left:4px">${daysLeft}天后</span>` : ''}
            </div>
            ${linkBtn}
          </div>
          <span class="tag ${st.cls}">${st.label}</span>
        </div>
      `;
    }).join('');
  },

  // 检测链接平台
  _detectPlatform(url) {
    const u = url.toLowerCase();
    if (u.includes('taobao.com') || u.includes('tmall.com')) return '淘宝';
    if (u.includes('jd.com')) return '京东';
    if (u.includes('pinduoduo.com') || u.includes('yangkeduo.com')) return '拼多多';
    if (u.includes('sunig.com')) return '苏宁';
    if (u.includes('xiaohongshu.com')) return '小红书';
    if (u.includes('douyin.com')) return '抖音';
    return '打开';
  },

  // 打开链接
  _openLink(url) {
    if (!url) return;
    // 尝试用 App URL Scheme 打开
    const u = url.toLowerCase();
    let appScheme = '';
    if (u.includes('taobao.com') || u.includes('tmall.com')) {
      appScheme = `taobao://${url.replace(/^https?:\/\//, '')}`;
    } else if (u.includes('jd.com')) {
      appScheme = `openapp.jdmobile://virtual?params=${encodeURIComponent(JSON.stringify({url}))}`;
    } else if (u.includes('pinduoduo.com') || u.includes('yangkeduo.com')) {
      appScheme = `pinduoduo://com.xunmeng.pinduoduo/${url.replace(/^https?:\/\//, '')}`;
    }

    if (appScheme && /Mobi|Android|iPhone/i.test(navigator.userAgent)) {
      const start = Date.now();
      window.location.href = appScheme;
      setTimeout(() => {
        if (Date.now() - start < 2500) {
          window.open(url, '_blank');
        }
      }, 2000);
    } else {
      window.open(url, '_blank');
    }
  },

  _bindEvents() {
    this.container.querySelectorAll('.filter-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        this.filter = tab.dataset.filter;
        this.render(this.container);
      });
    });

    this.container.querySelector('#add-shopping-btn').addEventListener('click', () => {
      this._showForm();
    });

    this.container.querySelectorAll('.todo-check').forEach(check => {
      check.addEventListener('click', (e) => {
        e.stopPropagation();
        const item = check.closest('.todo-item');
        const id = item.dataset.id;
        const data = Store.getById('shopping', id);
        if (data) {
          const newStatus = data.status === 'completed' ? 'pending' : 'completed';
          Store.update('shopping', id, { status: newStatus });
          this.render(this.container);
        }
      });
    });

    this.container.querySelectorAll('.todo-item').forEach(item => {
      item.addEventListener('click', () => {
        const data = Store.getById('shopping', item.dataset.id);
        if (data) this._showForm(data);
      });
    });
  },

  _showForm(item = null) {
    const isEdit = !!item;
    const title = isEdit ? '编辑待办' : '添加待办';
    const data = item || {
      name: '', purpose: '', budget: 0, link: '', deadline: '', status: 'pending'
    };

    const bodyHTML = `
      <div class="input-group">
        <label class="input-label">物品名称</label>
        <input class="input" id="form-name" value="${data.name}" placeholder="例如：七夕礼物 - 项链">
      </div>
      <div class="input-group">
        <label class="input-label">用途</label>
        <input class="input" id="form-purpose" value="${data.purpose}" placeholder="例如：七夕礼物">
      </div>
      <div class="input-group">
        <label class="input-label">预算</label>
        <input class="input" type="number" id="form-budget" value="${data.budget}" placeholder="0">
      </div>
      <div class="input-group">
        <label class="input-label">购买链接 <span class="input-hint">支持淘宝/京东/拼多多/小红书/抖音等</span></label>
        <input class="input" id="form-link" value="${data.link}" placeholder="粘贴商品链接，保存后可一键跳转购买">
        ${data.link ? `<div class="text-xs text-muted mt-xs">已识别平台：${ShoppingPage._detectPlatform(data.link)}</div>` : ''}
      </div>
      <div class="input-group">
        <label class="input-label">截止日期</label>
        <input class="input" type="date" id="form-deadline" value="${data.deadline}">
      </div>
      <div class="input-group">
        <label class="input-label">状态</label>
        <select class="input" id="form-status">
          <option value="pending" ${data.status === 'pending' ? 'selected' : ''}>待选购</option>
          <option value="ordered" ${data.status === 'ordered' ? 'selected' : ''}>已下单</option>
          <option value="completed" ${data.status === 'completed' ? 'selected' : ''}>已完成</option>
        </select>
      </div>
    `;

    Components.showModal(title, bodyHTML, (overlay) => {
      const updates = {
        name: overlay.querySelector('#form-name').value.trim(),
        purpose: overlay.querySelector('#form-purpose').value.trim(),
        budget: parseFloat(overlay.querySelector('#form-budget').value) || 0,
        link: overlay.querySelector('#form-link').value.trim(),
        deadline: overlay.querySelector('#form-deadline').value,
        status: overlay.querySelector('#form-status').value
      };

      if (!updates.name) {
        Utils.showToast('请填写物品名称');
        return;
      }

      if (isEdit) {
        Store.update('shopping', item.id, updates);
      } else {
        Store.add('shopping', updates);
      }
      overlay.remove();
      this.render(this.container);
      Utils.showToast(isEdit ? '已更新' : '已添加');
    });
  }
};
</script>
  <script>/* js/pages/ledger.js */
/* ===== 【我们的恋爱小宇宙】恋爱账本页面 ===== */
const LedgerPage = {
  viewMode: 'list',
  currentYear: new Date().getFullYear(),
  currentMonth: new Date().getMonth(),

  render(container) {
    this.container = container;
    const summary = Store.getLedgerMonthlySummary(this.currentYear, this.currentMonth);
    const items = Utils.filterByMonth(Store.getLedger(), this.currentYear, this.currentMonth);
    const sorted = [...items].sort((a, b) => new Date(b.date) - new Date(a.date));

    container.innerHTML = `
      ${this._renderHeader(summary)}
      ${this._renderMonthPicker()}
      <div class="page-content" style="padding-top:0">
        ${this._renderSummaryCards(summary)}
        <div id="ledger-content">
          ${this.viewMode === 'list' ? this._renderList(sorted) : this._renderChart()}
        </div>
      </div>
      <button class="btn-fab" id="add-ledger-btn">+</button>
    `;

    this._bindEvents();
    Components.animateCards(this.container, '.list-item');
  },

  _renderHeader(summary) {
    return `
      <div class="page-header">
        <div style="display:flex;align-items:center;gap:var(--space-md)">
          <div style="width:4px;height:24px;background:var(--text-primary);border-radius:2px"></div>
          <div>
            <h2 class="page-header-title">恋爱账本</h2>
            <p class="page-header-subtitle">${summary.count}笔记录 · 共${Utils.formatMoney(summary.total)}</p>
          </div>
        </div>
      </div>
    `;
  },

  _renderMonthPicker() {
    const months = [];
    for (let i = 0; i < 12; i++) {
      months.push({ month: i, label: Utils.getMonthName(i) });
    }

    const monthHTML = months.map(m => `
      <button class="filter-tab ${m.month === this.currentMonth && this.currentYear === new Date().getFullYear() - 0 ? 'active' : ''}" data-month="${m.month}" data-year="${this.currentYear}">${m.label}</button>
    `).join('');

    return `
      <div style="display:flex;align-items:center;gap:var(--space-sm);padding:0 var(--content-padding);margin-bottom:var(--space-sm)">
        <button class="btn btn-icon btn-ghost" id="prev-month" style="flex-shrink:0">◂</button>
        <div class="filter-tabs flex-1" style="padding:0;margin-bottom:0" id="month-tabs">
          ${monthHTML}
        </div>
        <button class="btn btn-icon btn-ghost" id="next-month" style="flex-shrink:0">▸</button>
        <button class="btn btn-sm btn-ghost" id="toggle-view" style="flex-shrink:0">
          ${this.viewMode === 'list' ? '📊' : '📋'}
        </button>
      </div>
    `;
  },

  _renderSummaryCards(summary) {
    const catNames = {
      '旅行': '✈️', '美食': '🍽️', '礼物': '🎁', '日用品': '🏠'
    };
    const catEntries = Object.entries(summary.categorySummary);
    const catTags = catEntries.map(([cat, amt]) => {
      const pct = summary.total > 0 ? ((amt / summary.total) * 100).toFixed(1) : 0;
      return `
        <div style="display:flex;align-items:center;gap:var(--space-sm);padding:var(--space-xs) 0">
          <span>${catNames[cat] || '📌'} ${cat}</span>
          <span class="font-medium text-sm">${Utils.formatMoney(amt)}</span>
          <span class="text-xs text-muted">${pct}%</span>
        </div>
      `;
    }).join('');

    return `
      <div class="card mb-base" style="margin:0 var(--content-padding) var(--space-base);border-left:3px solid var(--text-primary)">
        <div class="flex justify-between" style="margin-bottom:var(--space-md);text-align:center;gap:var(--space-sm)">
          <div style="flex:1;min-width:0">
            <div class="text-xs text-muted">他</div>
            <div class="font-semibold" style="font-size:var(--text-sm)">${Utils.formatMoney(summary.hisTotal)}</div>
          </div>
          <div style="flex:1;min-width:0">
            <div class="text-xs text-muted">总计</div>
            <div class="font-semibold" style="font-size:var(--text-md)">${Utils.formatMoney(summary.total)}</div>
          </div>
          <div style="flex:1;min-width:0">
            <div class="text-xs text-muted">她</div>
            <div class="font-semibold" style="font-size:var(--text-sm)">${Utils.formatMoney(summary.herTotal)}</div>
          </div>
        </div>
        <div class="divider-light"></div>
        ${catTags}
      </div>
    `;
  },

  _renderList(items) {
    if (items.length === 0) {
      return `
        <div class="empty-state">
          <div class="empty-icon">💰</div>
          <div class="empty-title">本月暂无记录</div>
          <div class="empty-desc">开始记录你们的共同开销吧</div>
        </div>
      `;
    }

    return items.map(l => {
      const d = new Date(l.date);
      const day = String(d.getDate()).padStart(2, '0');
      const hasReceipt = l.receipt && l.receipt.trim();

      return `
        <div class="list-item" data-id="${l.id}">
          <div style="width:40px;height:40px;border-radius:var(--radius-sm);background:var(--color-primary-ghost);display:flex;align-items:center;justify-content:center;font-size:var(--text-sm);font-weight:var(--weight-semibold);color:var(--text-secondary);flex-shrink:0">
            ${day}
          </div>
          <div class="list-item-content">
            <div class="list-item-title">${l.category}</div>
            <div class="list-item-desc">${l.payer}付款${hasReceipt ? ' · 🧾有收据' : ''}</div>
          </div>
          <div class="list-item-meta">
            <div class="list-item-amount">${Utils.formatMoney(l.amount)}</div>
            <div class="list-item-date">${l.category}</div>
          </div>
        </div>
      `;
    }).join('');
  },

  _renderChart() {
    const summary = Store.getLedgerMonthlySummary(this.currentYear, this.currentMonth);
    const catEntries = Object.entries(summary.categorySummary);

    const colors = {
      '旅行': '#1A1A1A',
      '美食': '#4D4D4D',
      '礼物': '#808080',
      '日用品': '#B3B3B3'
    };

    const segments = catEntries.map(([cat, amt]) => ({
      label: cat,
      value: amt,
      color: colors[cat] || '#BBAA9E'
    }));

    if (segments.length === 0) {
      return '<div class="empty-state"><div class="empty-desc">本月暂无数据</div></div>';
    }

    const pieContainer = document.createElement('div');
    Components.renderPieChart(pieContainer, segments);

    const recentMonths = Store.getLedgerRecentMonths(6);
    const barData = {
      labels: recentMonths.map(m => Utils.getMonthName(m.month)),
      values: recentMonths.map(m => m.total)
    };

    const barContainer = document.createElement('div');
    Components.renderBarChart(barContainer, null, {
      height: 160,
      barColor: 'var(--text-primary)',
      labels: barData.labels,
      values: barData.values,
      valueFormatter: v => v > 0 ? `¥${(v/1000).toFixed(1)}k` : '¥0'
    });

    return `
      <div class="card mb-base">
        <div class="card-title mb-base">本月分类占比</div>
        ${pieContainer.innerHTML}
      </div>
      <div class="card">
        <div class="card-title mb-base">近6个月趋势</div>
        ${barContainer.innerHTML}
      </div>
    `;
  },

  _bindEvents() {
    this.container.querySelector('#prev-month').addEventListener('click', () => {
      if (this.currentMonth === 0) { this.currentMonth = 11; this.currentYear--; }
      else { this.currentMonth--; }
      this.render(this.container);
    });

    this.container.querySelector('#next-month').addEventListener('click', () => {
      if (this.currentMonth === 11) { this.currentMonth = 0; this.currentYear++; }
      else { this.currentMonth++; }
      this.render(this.container);
    });

    this.container.querySelector('#toggle-view').addEventListener('click', () => {
      this.viewMode = this.viewMode === 'list' ? 'chart' : 'list';
      this.render(this.container);
    });

    this.container.querySelectorAll('.filter-tab[data-month]').forEach(tab => {
      tab.addEventListener('click', () => {
        this.currentMonth = parseInt(tab.dataset.month);
        this.currentYear = parseInt(tab.dataset.year);
        this.render(this.container);
      });
    });

    this.container.querySelector('#add-ledger-btn').addEventListener('click', () => {
      this._showForm();
    });

    this.container.querySelectorAll('.list-item[data-id]').forEach(item => {
      item.addEventListener('click', () => {
        const data = Store.getById('ledger', item.dataset.id);
        if (data) this._showForm(data);
      });
    });
  },

  _showForm(item = null) {
    const isEdit = !!item;
    const title = isEdit ? '编辑账目' : '添加账目';
    const data = item || {
      date: Utils.getToday(), category: '美食', amount: 0, payer: '他', relatedTravel: '', receipt: ''
    };

    const receiptPreviewHTML = data.receipt ? `
      <div style="position:relative;display:inline-block;margin-top:8px">
        <img src="${data.receipt}" style="max-width:200px;max-height:150px;object-fit:contain;border-radius:8px;border:1px solid var(--border-light)" onerror="this.style.display='none'">
        <button id="remove-receipt" style="position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--text-primary);color:#fff;border:none;font-size:12px;line-height:1;cursor:pointer">×</button>
      </div>
    ` : '';

    const categories = ['旅行', '美食', '礼物', '日用品'];
    const catOptions = categories.map(c =>
      `<option value="${c}" ${data.category === c ? 'selected' : ''}>${c}</option>`
    ).join('');

    const bodyHTML = `
      <div class="input-group">
        <label class="input-label">日期</label>
        <input class="input" type="date" id="form-date" value="${data.date}">
      </div>
      <div class="input-group">
        <label class="input-label">分类</label>
        <select class="input" id="form-category">${catOptions}</select>
      </div>
      <div class="input-group">
        <label class="input-label">金额</label>
        <input class="input" type="number" id="form-amount" value="${data.amount}" placeholder="0" step="0.01">
      </div>
      <div class="input-group">
        <label class="input-label">付款人</label>
        <select class="input" id="form-payer">
          <option value="他" ${data.payer === '他' ? 'selected' : ''}>他</option>
          <option value="她" ${data.payer === '她' ? 'selected' : ''}>她</option>
        </select>
      </div>
      <div class="input-group">
        <label class="input-label">关联行程（可选）</label>
        <select class="input" id="form-travel">
          <option value="">不关联</option>
          ${Store.getTravels().map(t => `<option value="${t.id}" ${data.relatedTravel === t.id ? 'selected' : ''}>${t.location}</option>`).join('')}
        </select>
      </div>
      <div class="input-group">
        <label class="input-label">收据照片 <span class="input-hint">从相册选择</span></label>
        <div style="display:flex;gap:var(--space-sm);align-items:center;flex-wrap:wrap">
          <label id="receipt-upload-label" style="display:inline-flex;align-items:center;justify-content:center;width:64px;height:64px;border:2px dashed var(--border-color);border-radius:8px;cursor:pointer;transition:all var(--transition-fast);flex-shrink:0">
            <span style="font-size:24px;color:var(--text-muted)">+</span>
            <input type="file" id="receipt-file-input" accept="image/*" style="display:none">
          </label>
          <div id="receipt-preview">${receiptPreviewHTML}</div>
        </div>
        <input type="hidden" id="form-receipt" value="${data.receipt || ''}">
      </div>
    `;

    Components.showModal(title, bodyHTML, (overlay) => {
      const updates = {
        date: overlay.querySelector('#form-date').value,
        category: overlay.querySelector('#form-category').value,
        amount: parseFloat(overlay.querySelector('#form-amount').value) || 0,
        payer: overlay.querySelector('#form-payer').value,
        relatedTravel: overlay.querySelector('#form-travel').value,
        receipt: overlay.querySelector('#form-receipt').value.trim()
      };

      if (!updates.date || updates.amount <= 0) {
        Utils.showToast('请填写日期和金额');
        return;
      }

      if (isEdit) {
        Store.update('ledger', item.id, updates);
      } else {
        Store.add('ledger', updates);
      }
      overlay.remove();
      this.render(this.container);
      Utils.showToast(isEdit ? '已更新' : '已添加');
    });

    // 绑定收据上传和删除
    const fileInput = document.querySelector('#receipt-file-input');
    const receiptHidden = document.querySelector('#form-receipt');
    const receiptPreview = document.querySelector('#receipt-preview');

    const removeBtn = document.querySelector('#remove-receipt');
    if (removeBtn) {
      removeBtn.addEventListener('click', () => {
        receiptHidden.value = '';
        receiptPreview.innerHTML = '';
      });
    }

    if (fileInput) {
      fileInput.addEventListener('change', () => {
        const file = fileInput.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          receiptHidden.value = e.target.result;
          receiptPreview.innerHTML = `
            <div style="position:relative;display:inline-block">
              <img src="${e.target.result}" style="max-width:200px;max-height:150px;object-fit:contain;border-radius:8px;border:1px solid var(--border-light)">
              <button id="remove-receipt" style="position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--text-primary);color:#fff;border:none;font-size:12px;line-height:1;cursor:pointer">×</button>
            </div>
          `;
          document.querySelector('#remove-receipt').addEventListener('click', () => {
            receiptHidden.value = '';
            receiptPreview.innerHTML = '';
          });
        };
        reader.readAsDataURL(file);
      });
    }
  }
};

  <script>/* js/pages/inspiration.js */
/* ===== 【我们的恋爱小宇宙】灵感素材库页面 ===== */
const InspirationPage = {
  filter: 'all',
  _dailyItems: null, // 缓存的今日精选
  _calendarContext: null, // 日历上下文缓存

  /**
   * 智能每日精选：根据日历上下文（节日/纪念日/季节/周末）优先匹配相关灵感
   * 每天展示 6-8 条，其中至少一半与当前场景相关
   */
  _getDailySelection() {
    if (this._dailyItems) return this._dailyItems;

    const allItems = Store.getInspiration();
    if (allItems.length === 0) { this._dailyItems = []; return []; }

    const contexts = Utils.getCalendarContext();
    const today = Utils.getToday();
    const dateHash = this._hashDate(today);

    // 收集所有场景标签（去重）
    const sceneTags = new Set();
    for (const ctx of contexts) {
      for (const tag of ctx.tags) sceneTags.add(tag);
    }

    // 给每条灵感打分：标签匹配越多分越高，日期哈希用来打破平局
    const scored = allItems.map(item => {
      let score = 0;
      for (const tag of (item.tags || [])) {
        if (sceneTags.has(tag)) score += 2; // 场景匹配加权
      }
      // 日期哈希微调（打散同分项）
      score += ((this._hashDate(item.id + today) % 10) / 10);
      return { item, score };
    });

    // 按分数降序排列
    scored.sort((a, b) => b.score - a.score);

    const targetCount = Math.min(5, allItems.length);
    const matchCount = Math.min(Math.max(3, Math.ceil(targetCount * 0.6)), targetCount); // 至少3条场景匹配

    // 取前 matchCount 条高分 + 从剩余中随机补足到 targetCount
    const selected = scored.slice(0, matchCount).map(s => s.item);
    const remaining = scored.slice(matchCount).map(s => s.item);

    // 用日期哈希从剩余中选
    const needed = targetCount - selected.length;
    for (let i = 0; i < needed && remaining.length > 0; i++) {
      const idx = (dateHash + i * 7) % remaining.length;
      selected.push(remaining.splice(idx, 1)[0]);
    }

    this._dailyItems = selected;
    this._calendarContext = contexts; // 缓存上下文给render用
    return selected;
  },

  _hashDate(dateStr) {
    let hash = 0;
    for (let i = 0; i < dateStr.length; i++) {
      hash = ((hash << 5) - hash) + dateStr.charCodeAt(i);
      hash |= 0;
    }
    return Math.abs(hash);
  },

  render(container) {
    this.container = container;
    // 同一日历天不清空缓存，保证一天内多次进入灵感页看到相同内容
    const today = Utils.getToday();
    if (this._lastRenderDate !== today) {
      this._dailyItems = null;
      this._lastRenderDate = today;
    }

    const items = Store.getInspiration();
    const platforms = [...new Set(items.map(i => i.platform))];
    const dailyItems = this._getDailySelection();
    const dailyCount = dailyItems.length;

    // 筛选：在今日精选范围内筛选
    let filtered;
    if (this.filter === 'all') {
      filtered = dailyItems;
    } else {
      filtered = dailyItems.filter(i => i.platform === this.filter || (i.tags || []).includes(this.filter));
    }

    container.innerHTML = `
      ${this._renderHeader()}
      ${this._renderFilters(platforms)}
      <div class="page-content" style="padding-top:0">
        ${this._renderDailyInspiration()}
        ${dailyCount === 0 ? this._renderDefaultSuggestions() : ''}
        <div id="inspiration-list" style="margin-top:var(--space-base)">
          ${this._renderList(filtered)}
        </div>
      </div>
      <button class="btn-fab" id="add-inspiration-btn">+</button>
    `;

    this._bindEvents();
    Components.animateCards(this.container, '.card');
  },

  _renderHeader() {
    const total = Store.getInspiration().length;
    const dailyCount = this._getDailySelection().length;
    const todayLabel = Utils.formatDateCN(new Date());
    const ctx = this._calendarContext || [];

    // 当前最紧急的场景
    let sceneBadge = '';
    if (ctx.length > 0) {
      const top = ctx[0];
      const label = top.daysUntil === 0 ? `今天是${top.scene}` : top.daysUntil <= 3 ? `⏰ ${top.scene}还有${top.daysUntil}天` : `📅 ${top.scene}还有${top.daysUntil}天`;
      sceneBadge = `<span class="tag tag-primary" style="font-size:11px">${label}</span>`;
    }

    return `
      <div class="page-header">
        <div style="display:flex;align-items:center;gap:var(--space-md)">
          <div style="width:4px;height:24px;background:var(--color-tips);border-radius:2px"></div>
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:center;gap:var(--space-sm)">
              <h2 class="page-header-title">灵感素材库</h2>
              ${sceneBadge}
            </div>
            <p class="page-header-subtitle">素材池${total}条 · 今日精选${dailyCount}条 · ${todayLabel}</p>
          </div>
        </div>
      </div>
    `;
  },

  _renderFilters(platforms) {
    const tabs = [
      { id: 'all', label: '全部' },
      ...platforms.map(p => ({ id: p, label: p }))
    ];
    const tabsHTML = tabs.map(t => `
      <button class="filter-tab ${this.filter === t.id ? 'active' : ''}" data-filter="${t.id}">${t.label}</button>
    `).join('');
    return `<div class="filter-tabs">${tabsHTML}</div>`;
  },

  /**
   * 当素材池为空时，展示默认推荐入口（小红书/抖音直达链接）
   */
  _renderDefaultSuggestions() {
    const today = new Date();
    const month = today.getMonth();
    const seasonScenes = {
      2: '春日踏青', 3: '春日踏青', 4: '春日踏青',
      5: '初夏旅行', 6: '夏日海边', 7: '夏日海边', 8: '夏日海边',
      9: '秋日拍照', 10: '秋日拍照', 11: '深秋居家',
      0: '冬日温泉', 1: '冬日温泉'
    };
    const scene = seasonScenes[month] || '情侣日常';
    const scenes = [
      { label: '🏠 居家约会', kw: '情侣居家约会创意低成本浪漫' },
      { label: '📸 情侣拍照', kw: '情侣拍照姿势氛围感' },
      { label: '🎁 礼物灵感', kw: '情侣走心礼物推荐小众高级' },
      { label: scene, kw: `情侣${scene}约会推荐` },
    ];

    const cardsHTML = scenes.map(s => `
      <div class="card card-hoverable card-accent-tips mb-sm" style="cursor:pointer" onclick="InspirationPage._quickJump('${s.kw}')">
        <div class="card-body" style="padding:var(--space-md);display:flex;align-items:center;gap:var(--space-sm);font-size:var(--text-sm)">
          <span>${s.label}</span>
          <span style="margin-left:auto;color:var(--color-primary);font-size:var(--text-xs)">📕 小红书 →</span>
        </div>
      </div>
    `).join('');

    return `
      <div style="margin-bottom:var(--space-base)">
        <div style="display:flex;align-items:center;gap:var(--space-sm);margin-bottom:var(--space-md)">
          <div style="width:3px;height:18px;background:var(--color-tips);border-radius:2px"></div>
          <span style="font-size:var(--text-sm);color:var(--text-secondary);font-weight:600">今日推荐探索</span>
        </div>
        ${cardsHTML}
        <div class="text-xs text-muted" style="text-align:center;margin-top:var(--space-sm)">
          💡 点击上方卡片直达小红书搜索 · 也可点击右下角 + 手动添加灵感
        </div>
      </div>
    `;
  },

  /**
   * 快速跳转到小红书搜索
   */
  _quickJump(keyword) {
    const url = `https://www.xiaohongshu.com/search_result?keyword=${encodeURIComponent(keyword)}&type=51`;
    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    if (isMobile) {
      const schemeUrl = `xhsdiscover://search/result?keyword=${encodeURIComponent(keyword)}`;
      this._tryOpenApp(schemeUrl, url);
    } else {
      window.open(url, '_blank');
    }
  },

  _renderDailyInspiration() {
    const tips = DAILY_TIPS;
    const idx = Utils.getDailyTipIndex(tips.length);
    const tip = tips[idx];
    const secondIdx = (idx + 7) % tips.length;
    const tip2 = tips[secondIdx];
    const dailyCount = this._getDailySelection().length;
    const xhsCount = this._getDailySelection().filter(i => i.platform === '小红书').length;
    const dyCount = this._getDailySelection().filter(i => i.platform === '抖音').length;
    const ctx = this._calendarContext || [];

    // 当前场景说明
    let sceneInfo = '';
    if (ctx.length > 0) {
      const top = ctx.filter(c => c.urgency !== 'seasonal').slice(0, 2);
      if (top.length > 0) {
        const labels = top.map(c => c.daysUntil === 0 ? `今天是「${c.scene}」` : `「${c.scene}」还有${c.daysUntil}天`).join('，');
        sceneInfo = `<div class="text-xs text-muted mt-sm" style="line-height:1.6">📅 ${labels} — 以下灵感已为你贴心筛选</div>`;
      }
    }

    return `
      <div class="card" style="background:#FAFAFA;margin-bottom:var(--space-base);border:none">
        <div class="flex items-center gap-sm mb-base">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="1.5">
            <path d="M9 18h6"/><path d="M10 22h4"/><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"/>
          </svg>
          <span class="card-title">今日恋爱灵感</span>
        </div>
        <p style="font-family:var(--font-serif);font-size:var(--text-md);color:var(--text-primary);line-height:1.9;margin-bottom:var(--space-md)">
          ${tip}
        </p>
        <div class="divider-light"></div>
        <p style="font-size:var(--text-sm);color:var(--text-secondary);line-height:1.8;margin-top:var(--space-md)">
          💫 ${tip2}
        </p>
        ${sceneInfo}
        <div class="text-xs text-muted mt-base">
          每日更新 · 今日精选${dailyCount}条灵感 · 📕${xhsCount}条小红书 + 🎵${dyCount}条抖音
        </div>
      </div>
    `;
  },

  _renderList(items) {
    if (items.length === 0) {
      return `
        <div class="empty-state">
          <div class="empty-icon">💡</div>
          <div class="empty-title">还没有灵感收藏</div>
          <div class="empty-desc">收藏小红书/抖音的恋爱灵感，点击即可跳转App查看</div>
        </div>
      `;
    }

    return items.map(item => {
      const platformIcon = item.platform === '小红书' ? '📕' : '🎵';
      const tagsHTML = (item.tags || []).map(tag =>
        `<span class="tag tag-tips">${tag}</span>`
      ).join(' ');

      const hasLink = item.url && item.url.trim().length > 0;
      const jumpHint = hasLink
        ? `<span style="font-size:var(--text-xs);color:var(--color-primary);display:flex;align-items:center;gap:2px">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
            打开${item.platform}
          </span>`
        : '';

      return `
        <div class="card card-hoverable card-accent-tips mb-base" data-id="${item.id}" data-has-link="${hasLink}" data-url="${item.url || ''}" data-platform="${item.platform}">
          <div class="card-header">
            <div class="flex items-center gap-sm">
              <span style="font-size:1.2rem">${platformIcon}</span>
              <span class="card-subtitle">${item.platform}</span>
            </div>
            <span class="text-xs text-muted">${Utils.formatDateShort(item.createdAt)}</span>
          </div>
          <div class="card-body">${item.summary}</div>
          <div class="card-footer">
            <div class="flex gap-sm flex-wrap">${tagsHTML}</div>
            ${jumpHint}
          </div>
        </div>
      `;
    }).join('');
  },

  _bindEvents() {
    this.container.querySelectorAll('.filter-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        this.filter = tab.dataset.filter;
        this.render(this.container);
      });
    });

    this.container.querySelector('#add-inspiration-btn').addEventListener('click', () => {
      this._showForm();
    });

    this.container.querySelectorAll('.card[data-id]').forEach(card => {
      card.addEventListener('click', (e) => {
        const item = Store.getById('inspiration', card.dataset.id);
        if (!item) return;

        const hasLink = card.dataset.hasLink === 'true';
        const url = card.dataset.url;
        const platform = card.dataset.platform;

        if (hasLink && url) {
          // 尝试用App URL Scheme跳转
          this._openInApp(platform, url);
        } else {
          // 没有链接则进入编辑
          this._showForm(item);
        }
      });

      // 长按卡片进入编辑（移动端）
      let longPressTimer;
      card.addEventListener('touchstart', () => {
        longPressTimer = setTimeout(() => {
          const item = Store.getById('inspiration', card.dataset.id);
          if (item) this._showForm(item);
        }, 600);
      });
      card.addEventListener('touchend', () => clearTimeout(longPressTimer));
      card.addEventListener('touchmove', () => clearTimeout(longPressTimer));
    });
  },

  /**
   * 尝试用App URL Scheme打开小红书/抖音
   * 移动端优先用scheme，PC端用网页版兜底
   */
  _openInApp(platform, url) {
    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

    if (platform === '小红书') {
      if (isMobile) {
        // 手机端：尝试用小红书 App 搜索 scheme 打开
        const keywordMatch = url.match(/keyword=([^&]+)/);
        const keyword = keywordMatch ? decodeURIComponent(keywordMatch[1]) : '情侣';
        const schemeUrl = `xhsdiscover://search/result?keyword=${encodeURIComponent(keyword)}`;
        this._tryOpenApp(schemeUrl, 'https://www.xiaohongshu.com');
      } else {
        // PC 端：直接打开网页版搜索
        window.open(url, '_blank');
      }
    } else if (platform === '抖音') {
      if (isMobile) {
        // 手机端：尝试用抖音 App URL Scheme 唤起
        const schemeUrl = this._buildDouyinScheme(url);
        const fallbackUrl = url.startsWith('http') ? url : `https://www.douyin.com/video/${url}`;
        this._tryOpenApp(schemeUrl, fallbackUrl);
      } else {
        const webUrl = url.startsWith('http') ? url : `https://www.douyin.com/video/${url}`;
        window.open(webUrl, '_blank');
      }
    } else {
      window.open(url, '_blank');
    }
  },

  /**
   * 根据抖音网页链接构造 App URL Scheme
   * 支持: douyin.com/search/xxx → snssdk1128://search?keyword=xxx
   *       douyin.com/hashtag/xxx → snssdk1128://hashtag?id=xxx
   *       v.douyin.com/xxx → 直接作为 fallback（短链会自动跳转）
   */
  _buildDouyinScheme(url) {
    // 搜索页: https://www.douyin.com/search/关键词
    const searchMatch = url.match(/douyin\.com\/search\/(.+)/);
    if (searchMatch) {
      const keyword = decodeURIComponent(searchMatch[1]);
      return `snssdk1128://search?keyword=${encodeURIComponent(keyword)}`;
    }
    // 话题页: https://www.douyin.com/hashtag/数字ID
    const hashtagMatch = url.match(/douyin\.com\/hashtag\/(\d+)/);
    if (hashtagMatch) {
      return `snssdk1128://hashtag?id=${hashtagMatch[1]}`;
    }
    // 其他情况直接用原始 URL（Universal Link 会尝试唤起 App）
    return url;
  },

  /**
   * 尝试唤起App，超时后降级到网页版
   * iOS Safari 用 smart app banner 或 universal link
   * Android 用 intent:// 或直接 location.href
   */
  _tryOpenApp(appUrl, fallbackUrl) {
    const startTime = Date.now();
    const timeout = 2500;

    // 记录页面隐藏时间（App切换成功会触发）
    let hiddenTime = 0;
    const onVisibilityChange = () => {
      if (document.hidden) {
        hiddenTime = Date.now();
      }
    };
    document.addEventListener('visibilitychange', onVisibilityChange, { once: false });

    // 尝试跳转
    window.location.href = appUrl;

    // 超时降级：如果2.5秒后还在当前页面，说明App没装，跳网页版
    setTimeout(() => {
      document.removeEventListener('visibilitychange', onVisibilityChange);
      // 如果页面从未隐藏过（App没被唤起），降级到网页版
      if (hiddenTime === 0 || Date.now() - hiddenTime < 100) {
        window.open(fallbackUrl, '_blank');
      }
    }, timeout);
  },

  _showForm(item = null) {
    const isEdit = !!item;
    const title = isEdit ? '编辑灵感' : '添加灵感';
    const data = item || {
      platform: '小红书', url: '', screenshot: '', summary: '', tags: [], createdAt: Utils.getToday()
    };

    const tagOptions = ['清单', '情侣活动', '穿搭', '冬季', '约会', '低成本', '拍照', '居家', '纪念日', '惊喜', '旅行', '目的地', '礼物', '指南', '美食'];
    const tagsHTML = tagOptions.map(tag => {
      const checked = (data.tags || []).includes(tag) ? 'checked' : '';
      return `
        <label style="display:inline-flex;align-items:center;gap:4px;margin-right:12px;margin-bottom:8px;cursor:pointer;font-size:var(--text-sm);color:var(--text-secondary)">
          <input type="checkbox" value="${tag}" ${checked} style="accent-color:var(--text-primary)"> ${tag}
        </label>
      `;
    }).join('');

    const bodyHTML = `
      <div class="input-group">
        <label class="input-label">来源平台</label>
        <select class="input" id="form-platform">
          <option value="小红书" ${data.platform === '小红书' ? 'selected' : ''}>小红书</option>
          <option value="抖音" ${data.platform === '抖音' ? 'selected' : ''}>抖音</option>
        </select>
      </div>
      <div class="input-group">
        <label class="input-label">链接</label>
        <input class="input" id="form-url" value="${data.url}" placeholder="粘贴小红书/抖音链接">
      </div>
      <div class="input-group">
        <label class="input-label">内容摘要</label>
        <textarea class="input" id="form-summary" placeholder="简要描述内容...">${data.summary}</textarea>
      </div>
      <div class="input-group">
        <label class="input-label">标签</label>
        <div style="padding-top:4px">${tagsHTML}</div>
      </div>
    `;

    Components.showModal(title, bodyHTML, (overlay) => {
      const tags = [];
      overlay.querySelectorAll('input[type="checkbox"]:checked').forEach(cb => tags.push(cb.value));

      const updates = {
        platform: overlay.querySelector('#form-platform').value,
        url: overlay.querySelector('#form-url').value.trim(),
        summary: overlay.querySelector('#form-summary').value.trim(),
        tags
      };

      if (!updates.summary) {
        Utils.showToast('请填写内容摘要');
        return;
      }

      if (isEdit) {
        Store.update('inspiration', item.id, updates);
      } else {
        Store.add('inspiration', updates);
      }
      overlay.remove();
      this.render(this.container);
      Utils.showToast(isEdit ? '已更新' : '已添加');
    });
  }
};
</script>

  // ==================== 摇骰子（联机比大小） ====================
  _diceState: { myNums: null, oppNums: null, cupOpen: false, shaking: false, round: 0 },

  _renderDice(container) {

  _diceRoll() {
    SFX.shake();
    const s = this._diceState;
    if (s.shaking) return;
    s.shaking = true;
    s.cupOpen = false;
    s.myNums = Array.from({length: 5}, () => Math.floor(Math.random() * 6) + 1);

  _diceToggle() {
    SFX.cupOpen();
    const s = this._diceState;
    if (s.shaking) return;
    if (!s.myNums) return; // 还没摇过

    if (!s.cupOpen) {
      s.cupOpen = true;
      document.getElementById('dice-cup').classList.add('cup-lifted');
      this._diceRenderDots();
      GameSync.send('dice_open', { nums: s.myNums });
      this._diceCheckResult();
    } else {
      s.cupOpen = false;
      document.getElementById('dice-cup').classList.remove('cup-lifted');
      document.getElementById('dice-tray').innerHTML = '<div class="dice-tray-label">?</div>';
      document.getElementById('dice-result').textContent = '';

  _diceRenderDots() {
    const tray = document.getElementById('dice-tray');
    if (!tray) return;
    tray.innerHTML = this._diceState.myNums.map(n => `
      <div class="dice-dot">
        ${this._diceDotsSVG(n)}
      </div>
    `).join('');
  },

  _diceDotsSVG(n) {
    const dots = { 1: [[1,1]], 2: [[0,0],[2,2]], 3: [[0,0],[1,1],[2,2]], 4: [[0,0],[0,2],[2,0],[2,2]], 5: [[0,0],[0,2],[1,1],[2,0],[2,2]], 6: [[0,0],[0,2],[1,0],[1,2],[2,0],[2,2]] };
    // 标准骰子：1点和4点为红色，其余为暗蓝色
    const colorClass = (n === 1 || n === 4) ? 'red' : 'blue';
    return `<svg viewBox="0 0 3 3" style="width:100%;height:100%">${(dots[n]||[]).map(([r,c]) => `<circle cx="${c+0.5}" cy="${r+0.5}" r="0.38" class="${colorClass}"/>`).join('')}</svg>`;
  },

  _diceCheckResult() {
    const s = this._diceState;
    if (!s.myNums || !s.oppNums) return;
    const mySum = s.myNums.reduce((a, b) => a + b, 0);
    const oppSum = s.oppNums.reduce((a, b) => a + b, 0);
    setTimeout(() => {
      if (mySum > oppSum) SFX.win(); else if (mySum < oppSum) SFX.lose();
    }, 200);
    const winner = mySum > oppSum ? '你赢了！' : mySum < oppSum ? '你输了' : '平局';
    document.getElementById('dice-result').innerHTML = `你 <b>${mySum}</b> : <b>${oppSum}</b> TA &nbsp; ${winner}`;
    // 显示再来按钮
    const area = document.querySelector('.dice-area');
    if (area && !document.getElementById('dice-again-btn')) {
      const btn = document.createElement('button');
      btn.id = 'dice-again-btn';
      btn.className = 'dice-again-btn';
      btn.textContent = '再来';
      btn.onclick = () => { btn.remove(); GamePage._diceAgain(); };
      area.appendChild(btn);
    }
  },

  _diceAgain() {
    SFX.tap();
    this._diceState = { myNums: null, oppNums: null, cupOpen: false, shaking: false, round: this._diceState.round + 1 };
    this._diceUpdateUI();
    GameSync.send('dice_again', {});
  },

  _diceUpdateUI() {
    const btn = document.getElementById('dice-shake-btn');
    if (btn) btn.disabled = false;
    const cup = document.getElementById('dice-cup');
    if (cup) cup.classList.remove('cup-lifted');
    const cc = document.getElementById('dice-cup-container');
    if (cc) cc.classList.remove('shaking');
    const tray = document.getElementById('dice-tray');
    if (tray) tray.innerHTML = '<div class="dice-tray-label">?</div>';
    const result = document.getElementById('dice-result');
    if (result) result.textContent = '';
    const status = document.getElementById('dice-opp-status');
    if (status) status.textContent = '等待TA加入...';
    const again = document.getElementById('dice-again-btn');
    if (again) again.remove();
  },

  _math24StartBattle() {
    SFX.tap();
    const cards = this._math24Gen();
    this._math24State.cards = cards.cards;
    this._math24State.solution = cards.solution;
    this._math24State.solved = false;
    this._math24State.oppSolved = false;
    this._math24State.steps = [];
    this._math24State.firstCard = null;
    this._math24State.op = null;
    const container = document.getElementById('page-content') || document.getElementById('dashboard-content');

  _math24Gen() {
    let cards, solution;
    do { cards = Array.from({length:4}, () => Math.floor(Math.random()*10)+1); solution = this._math24Find(cards); } while (!solution);
    return { cards, solution };
  },

  _math24Find(nums) {
    const ops = ['+','-','*','/'];
    const calc = (a,b,op) => { switch(op){ case'+':return a+b; case'-':return a-b; case'*':return a*b; case'/':return b!==0?a/b:NaN; } };
    const perm = (arr) => { if(arr.length<=1) return [arr]; const r=[]; for(let i=0;i<arr.length;i++){ const rest=[...arr.slice(0,i),...arr.slice(i+1)]; for(const p of perm(rest)) r.push([arr[i],...p]); } return r; };
    for(const [a,b,c,d] of perm(nums)){
      for(const o1 of ops) for(const o2 of ops) for(const o3 of ops){
        const exprs = [
          [calc(calc(calc(a,b,o1),c,o2),d,o3), `(({a}${o1}{b})${o2}{c})${o3}{d}`],
          [calc(calc(a,calc(b,c,o2),o1),d,o3), `(${a}${o1}(${b}${o2}${c}))${o3}${d}`],
          [calc(a,calc(calc(b,c,o2),d,o3),o1), `${a}${o1}((${b}${o2}${c})${o3}${d})`],
          [calc(a,calc(b,calc(c,d,o3),o2),o1), `${a}${o1}(${b}${o2}(${c}${o3}${d}))`],
          [calc(calc(a,b,o1),calc(c,d,o3),o2), `(${a}${o1}${b})${o2}(${c}${o3}${d})`]
        ];
        for(const [val,expr] of exprs){ if(Math.abs(val-24)<0.0001) return expr+'=24'; }
      }
    }
    return null;
  },

  _math24RenderBattle(container) {
    if (!container) container = document.getElementById('page-content') || document.getElementById('dashboard-content');
    if (!container) return;
    const solo = this._math24State.mode === 'solo';
    container.innerHTML = `
      <div class="game-page game-page-light">
        <div class="game-header">
          <button class="game-header-btn" onclick="GamePage._math24ShowLobby(document.getElementById('page-content')||document.getElementById('dashboard-content'))">←</button>
          <span class="game-header-title">算24点</span>
          <div style="width:36px"></div>
        </div>
        <div class="game-content" style="text-align:center">
          <div class="m24-score-bar">
            <span>你 <b id="m24-my-score" style="color:#00B894;font-size:18px">0</b> 分</span>
            <span style="color:var(--text-muted)">|</span>
            ${solo ? '<span style="color:var(--text-muted)">单人练习</span>' : '<span>TA <b id="m24-opp-score" style="color:#FF6B8A;font-size:18px">0</b> 分</span>'}
          </div>
          <div id="m24-opp-status" style="height:22px;font-size:13px;color:#FF6B8A;margin-bottom:14px;font-weight:600"></div>

          <div id="m24-cards" style="display:flex;justify-content:center;gap:16px;margin-bottom:28px;min-height:100px;align-items:center">
            <span style="color:var(--text-muted);font-size:14px">题目加载中...</span>
          </div>

          <div style="font-size:12px;color:var(--text-muted);margin-bottom:12px">选数字 → 选运算符 → 再选数字</div>
          <div id="m24-ops" style="display:flex;justify-content:center;gap:12px;margin-bottom:18px">
            ${['+','−','×','÷'].map(op => `<button class="m24-op-btn" id="m24-op-${op}" onclick="GamePage._math24ClickOp('${op}')">${op}</button>`).join('')}
          </div>

          <div id="m24-steps"></div>

          <div style="display:flex;gap:10px;justify-content:center">
            <button class="btn btn-ghost btn-sm" onclick="GamePage._math24Undo()" style="border-radius:12px;padding:10px 18px">撤销</button>
            <button class="btn btn-ghost btn-sm" onclick="GamePage._math24StartBattle()" style="border-radius:12px;padding:10px 18px">换题</button>
          </div>
          <div id="m24-result"></div>
        </div>
      </div>
    `;
    this._math24RenderCards();
    this._math24UpdateScore();
  },

  _math24RenderCards() {
    const div = document.getElementById('m24-cards');
    if (!div) return;
    const state = this._math24State;
    const ids = state.cards.map((c, i) => ({ val: c, id: 'c' + Date.now() + i + '_' + c }));
    state._cardIds = ids;
    div.innerHTML = ids.map(({val, id}) => {
      const isSelected = state.firstCard && state.firstCard.dataset.id === id;
      return `
        <div class="m24-card ${isSelected ? 'selected' : ''}" data-id="${id}" data-val="${val}" onclick="GamePage._math24ClickCard(this)">
          <span class="m24-card-num">${val}</span>
        </div>
      `;
    }).join('');
    // 恢复 firstCard 引用
    if (state.firstCard) {
      const el = div.querySelector(`[data-id="${state.firstCard.dataset.id}"]`);
      if (el) state.firstCard = el;
    }
  },

  _math24ClickCard(el) {
    SFX.tap();
    const state = this._math24State;
    if (state.solved || state.oppSolved) return;

    // 无选中数字：选中它
    if (!state.firstCard) {
      state.firstCard = el;
      el.classList.add('selected');
      return;
    }

    // 已选运算符：执行运算
    if (state.op) {
      if (el === state.firstCard) { // 取消
        state.firstCard.classList.remove('selected');
        state.firstCard = null;
        state.op = null;
        this._math24UnhighlightOp();
        return;
      }
      this._math24ApplyOp(state.firstCard, el, state.op);
      state.firstCard = null;
      state.op = null;
      this._math24UnhighlightOp();
      return;
    }

    // 已选数字未选运算符：切换数字
    if (state.firstCard) {
      state.firstCard.classList.remove('selected');
      if (el === state.firstCard) {
        state.firstCard = null;
      } else {
        state.firstCard = el;
        el.classList.add('selected');
      }
    }
  },

  _math24ClickOp(op) {
    SFX.tap();
    const state = this._math24State;
    if (state.solved || state.oppSolved) return;
    if (!state.firstCard) { Utils.showToast('先选一个数字'); return; }
    state.op = op;
    document.querySelectorAll('.m24-op-btn').forEach(b => b.classList.remove('selected'));
    const btn = document.getElementById('m24-op-' + op);
    if (btn) btn.classList.add('selected');
  },

  _math24UnhighlightOp() {
    document.querySelectorAll('.m24-op-btn').forEach(b => b.classList.remove('selected'));
  },

  _math24ApplyOp(aEl, bEl, op) {
    const a = parseInt(aEl.dataset.val), b = parseInt(bEl.dataset.val);
    let result, expr;
    switch(op) {
      case '+': result = a + b; expr = `${a}+${b}=${result}`; break;
      case '−': result = a - b; expr = `${a}−${b}=${result}`; break;
      case '×': result = a * b; expr = `${a}×${b}=${result}`; break;
      case '÷':
        if (b === 0 || a % b !== 0) {
          Utils.showToast('不能整除，换种算法');
          return;
        }
        result = a / b; expr = `${a}÷${b}=${result}`; break;
    }

    // 记录步骤
    this._math24State.steps.push(expr);
    document.getElementById('m24-steps').textContent = this._math24State.steps.join('  →  ');

    // 合并：保留 aEl，删除 bEl
    aEl.dataset.val = result;
    aEl.querySelector('.m24-card-num').textContent = result;
    aEl.classList.remove('selected');
    bEl.remove();

    // 只剩一个数字，检查结果
    const remaining = document.querySelectorAll('.m24-card');
    if (remaining.length === 1 && parseInt(remaining[0].dataset.val) === 24) {
      this._math24Win(expr);
    } else if (remaining.length === 1) {
      SFX.wrong();
      const resultEl = document.getElementById('m24-result');
      if (resultEl) resultEl.textContent = '结果是 ' + remaining[0].dataset.val + '，再试一次';
      setTimeout(() => {
        this._math24State.steps = [];
        this._math24RenderCards();
        const stepsEl = document.getElementById('m24-steps');
        const resEl = document.getElementById('m24-result');
        if (stepsEl) stepsEl.textContent = '';
        if (resEl) resEl.textContent = '';
      }, 1500);
    }
  },

  _math24Win(expr) {
    SFX.correct();
    const state = this._math24State;
    if (state.solved || state.oppSolved) return;
    state.solved = true;
    state.myScore++;
    this._math24UpdateScore();
    const resultEl = document.getElementById('m24-result');
    if (resultEl) resultEl.textContent = '你算出来了！' + expr;
    this._math24SetOppStatus(state.mode === 'online' ? '你抢答成功' : '答对了！');
    if (state.mode === 'online') {
      GameSync.send('m24_solved', { expr });
    }
    this._math24DisableInput();
    setTimeout(() => this._math24NextQuestion(), 2000);
  },

  _math24NextQuestion() {
    this._math24StartBattle();
  },

  _math24DisableInput() {
    document.querySelectorAll('.m24-card, .m24-op-btn').forEach(el => {

      el.style.pointerEvents = 'none';

  _mentalGenQuestion() {
    const diff = this._mentalState.difficulty;
    let a, b, op, answer;
    if (diff === 'easy') {
      // 1-3年级：20以内加减法 + 表内乘法
      const r = Math.random();
      if (r < 0.35) { op = '+'; a = Math.floor(Math.random()*19)+1; b = Math.floor(Math.random()*(20-a))+1; answer = a+b; }
      else if (r < 0.7) { op = '−'; a = Math.floor(Math.random()*19)+2; b = Math.floor(Math.random()*a)+1; answer = a-b; }
      else { op = '×'; a = Math.floor(Math.random()*9)+1; b = Math.floor(Math.random()*9)+1; answer = a*b; }
    } else {
      // 4-6年级：混合运算
      const r = Math.random();
      if (r < 0.25) { op = '+'; a = Math.floor(Math.random()*90)+10; b = Math.floor(Math.random()*90)+10; answer = a+b; }
      else if (r < 0.5) { op = '−'; a = Math.floor(Math.random()*90)+20; b = Math.floor(Math.random()*a)+1; answer = a-b; }
      else if (r < 0.75) { op = '×'; a = Math.floor(Math.random()*20)+5; b = Math.floor(Math.random()*9)+2; answer = a*b; }
      else { op = '÷'; b = Math.floor(Math.random()*9)+2; answer = Math.floor(Math.random()*9)+2; a = answer * b; }
    }
    return { q: `${a} ${op} ${b} = ?`, a: answer, op };
  },

  _mentalShowBattle(container) {
    const solo = this._mentalState.mode === 'solo';
    const total = this._mentalState.totalRounds;
    container.innerHTML = `
      <div class="game-page game-page-light">
        <div class="game-header">
          <button class="game-header-btn" onclick="GamePage._mentalShowLobby(document.getElementById('page-content')||document.getElementById('dashboard-content'))">←</button>
          <span class="game-header-title">口算对战</span>
          <div style="width:36px"></div>
        </div>
        <div class="game-content" style="text-align:center">
          <div class="mental-score-bar">
            <span>得分 <b id="m-my-score" style="color:#6C5CE7;font-size:18px">0</b></span>
            <span class="divider">|</span>
            <span>第 <b id="m-round" style="font-size:16px">1</b>/${total} 题</span>
            ${solo ? '' : '<span class="divider">|</span><span>TA <b id="m-opp-score" style="color:#FF6B8A;font-size:18px">0</b></span>'}
          </div>
          ${solo ? '' : '<div id="m-opp-status"></div>'}

          <div id="m-question" style="white-space:nowrap">
            ${this._mentalState.question}
          </div>

          <div id="m-my-input">
            ${this._mentalState.input || '?'}
          </div>

          <div id="m-result-msg" style="min-height:28px;font-size:15px;margin-bottom:10px;font-weight:600"></div>

          <div class="m-numpad" id="m-numpad">
            ${[1,2,3,4,5,6,7,8,9,'C',0,'✓'].map(k => `
              <button class="m-num-btn ${k==='✓'?'m-submit':k==='C'?'m-clear':''}" onclick="GamePage._mentalInput('${k}')">${k}</button>
            `).join('')}
          </div>
        </div>
      </div>
    `;
  },

  _mentalInput(key) {
    if (this._mentalState.answered || this._mentalState.oppAnswered) return;
    if (key !== '✓') SFX.tap();
    const solo = this._mentalState.mode === 'solo';
    if (key === 'C') { this._mentalState.input = ''; this._mentalUpdateBattle(); return; }
    if (key === '✓') {
      SFX.submit();
      const val = parseInt(this._mentalState.input);
      if (isNaN(val)) return;
      const correct = val === this._mentalState.answer;
      if (correct) {
        SFX.correct();
        this._mentalState.answered = true;
        this._mentalState.myScore++;
        this._mentalUpdateScore();
        const msg = document.getElementById('m-result-msg');
        if (msg) msg.textContent = solo ? '答对了！' : '你抢答成功！';
        this._mentalUpdateBattle();

        if (!solo) {
          // 联机：先答对，通知对方
          GameSync.send('mental_answer', { correct: true });
        }

        const roundComplete = this._mentalState.round >= this._mentalState.totalRounds - 1;
        if (roundComplete) {
          setTimeout(() => {
            if (!solo) GameSync.send('mental_end', { myScore: this._mentalState.myScore, oppScore: this._mentalState.oppScore });
            this._mentalShowResult(this._mentalState.myScore, this._mentalState.oppScore);
          }, 1500);
        } else {
          setTimeout(() => this._mentalNextQuestion(), 1200);
        }
      } else {
        SFX.wrong();
        document.getElementById('m-result-msg').textContent = '不对，再算算';
        this._mentalState.input = '';
        this._mentalUpdateBattle();
      }
      return;
    }
    if (this._mentalState.input.length < 5) this._mentalState.input += key;
    this._mentalUpdateBattle();
  },

  _mentalUpdateBattle() {
    const inputEl = document.getElementById('m-my-input');
    if (inputEl) inputEl.textContent = this._mentalState.input || '?';
  },

  _mentalUpdateScore() {
    const my = document.getElementById('m-my-score');
    if (my) my.textContent = this._mentalState.myScore;
    const opp = document.getElementById('m-opp-score');
    if (opp) opp.textContent = this._mentalState.oppScore;
  },

  _mentalDisableInput() {
    const pad = document.getElementById('m-numpad');
    if (pad) pad.style.pointerEvents = 'none';
    if (pad) pad.style.opacity = '0.6';
  },

  _mentalEnableInput() {
    const pad = document.getElementById('m-numpad');
    if (pad) { pad.style.pointerEvents = ''; pad.style.opacity = ''; }
  },

  _mentalNextQuestion() {
    if (this._mentalState.round >= this._mentalState.totalRounds - 1) return;
    this._mentalState.round++;
    this._mentalState.answered = false;
    this._mentalState.oppAnswered = false;
    this._mentalState.input = '';

    const q = this._mentalGenQuestion();
    this._mentalState.question = q.q;
    this._mentalState.answer = q.a;

    document.getElementById('m-question').textContent = q.q;
    document.getElementById('m-round').textContent = this._mentalState.round + 1;
    document.getElementById('m-my-input').textContent = '?';
    document.getElementById('m-result-msg').textContent = '';
    const oppStatus = document.getElementById('m-opp-status');
    if (oppStatus) oppStatus.textContent = '';
    this._mentalEnableInput();

    if (this._mentalState.mode !== 'solo' && this._mentalState.isHost) {
      GameSync.send('mental_next', { q: q.q, a: q.a });
    }
  },

  _mentalShowResult(myScore, oppScore) {
    SFX.finish(myScore > oppScore);
    const container = document.getElementById('page-content') || document.getElementById('dashboard-content');
    if (!container) return;
    const solo = this._mentalState.mode === 'solo';
    const total = this._mentalState.totalRounds;
    const rate = myScore / total;
    const winner = solo ? (rate >= 0.9 ? '🏆 天才！' : rate >= 0.7 ? '🎉 太棒了！' : rate >= 0.5 ? '👍 还不错！' : '💪 继续加油！')
      : (myScore > oppScore ? '🏆 你赢了！' : myScore < oppScore ? '😅 你输了' : '🤝 平局！');
    const emoji = solo ? (rate >= 0.9 ? '🌟' : rate >= 0.7 ? '🎉' : rate >= 0.5 ? '👍' : '💪') : (myScore > oppScore ? '🏆' : myScore < oppScore ? '😅' : '🤝');
    const bgColor = solo ? (rate >= 0.9 ? 'linear-gradient(135deg, #6C5CE7, #A29BFE)' : rate >= 0.7 ? 'linear-gradient(135deg, #00B894, #55EFC4)' : rate >= 0.5 ? 'linear-gradient(135deg, #FF9F43, #FECA57)' : 'linear-gradient(135deg, #636E72, #B2BEC3)')
      : (myScore > oppScore ? 'linear-gradient(135deg, #6C5CE7, #A29BFE)' : myScore < oppScore ? 'linear-gradient(135deg, #FF6B8A, #FFB8D0)' : 'linear-gradient(135deg, #636E72, #B2BEC3)');
    container.innerHTML = `
      <div class="game-page game-page-light">
        <div class="game-header">
          <button class="game-header-btn" onclick="GamePage._mentalShowLobby(document.getElementById('page-content')||document.getElementById('dashboard-content'))">←</button>
          <span class="game-header-title">口算对战</span>
          <div style="width:36px"></div>
        </div>
        <div class="game-content" style="text-align:center;padding-top:32px">
          <div style="width:80px;height:80px;border-radius:50%;background:${bgColor};display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:40px;box-shadow:0 8px 30px rgba(0,0,0,0.12)">${emoji}</div>
          <div style="font-size:22px;font-weight:800;margin-bottom:6px">${winner}</div>
          <div style="font-size:48px;font-weight:800;margin-bottom:6px;background:${bgColor};-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">${myScore} / ${total}</div>
          ${solo ? '<div style="font-size:14px;color:var(--text-muted);margin-bottom:28px">答对 ' + myScore + ' 题，正确率 ' + Math.round(rate*100) + '%</div>' : '<div style="font-size:16px;font-weight:600;margin-bottom:28px;color:var(--text-secondary)">你 <span style="color:#6C5CE7;font-size:20px">' + myScore + '</span> : <span style="color:#FF6B8A;font-size:20px">' + oppScore + '</span> TA</div>'}
          <button class="btn" onclick="GamePage._mentalShowLobby(document.getElementById('page-content')||document.getElementById('dashboard-content'))" style="width:220px;padding:14px;border-radius:16px;background:linear-gradient(135deg,#6C5CE7,#5A4BD1);color:#fff;font-size:16px;font-weight:700;border:none;box-shadow:0 4px 16px rgba(108,92,231,0.3);cursor:pointer">再来一局</button>
        </div>
      </div>
    `;
  }
};
</script>

  <!-- 应用入口 -->
  <script>/* js/app.js */
/* ===== 【我们的恋爱小宇宙】应用入口 & 路由管理 ===== */
const App = {
  currentPage: 'dashboard',
  pages: {},

  async init() {
    const app = document.getElementById('app');
    if (!app) return;

    // 检查登录态
    if (!Auth.isLoggedIn()) {
      Auth.renderLoginPage(app);
      this._hideSkeleton();
      return;
    }

    // 初始化数据层（从服务器同步），带兜底：失败也允许进入
    try {
      await Store.init();
    } catch (e) {
      console.error('Store 初始化失败，回退到登录页:', e);
      sessionStorage.removeItem('love_token');
      sessionStorage.removeItem('love_name');
      Auth.renderLoginPage(app);
      this._hideSkeleton();
      return;
    }

    // 注册所有页面
    this.pages = {
      dashboard: DashboardPage,
      timeline: TimelinePage,
      travel: TravelPage,
      game: GamePage,
      shopping: ShoppingPage,
      ledger: LedgerPage,
      inspiration: InspirationPage
    };

    // 读取URL hash
    const hash = window.location.hash.replace('#', '');
    if (hash && this.pages[hash]) {
      this.currentPage = hash;
    }

    // 渲染
    this.render();

    // 监听hash变化
    window.addEventListener('hashchange', async () => {
      const newHash = window.location.hash.replace('#', '');
      if (newHash && this.pages[newHash]) {
        this.currentPage = newHash;
        // GitHub 同步在 Store 内部轮询
        this.render();
      }
    });

    // GitHub 同步已经在 Store 内部处理了轮询，这里不再重复

    // 检查纪念日提醒
    this.checkReminders();

    // 每小时检查一次
    setInterval(() => this.checkReminders(), 3600000);

    // 清理计时器
    window.addEventListener('beforeunload', () => {
      if (Components._counterInterval) clearInterval(Components._counterInterval);
    });
  },

  // 登录成功后重新初始化
  async initAfterLogin() {
    await this.init();
  },

  // 刷新当前页面（用于数据更新后重渲染）
  refresh() {
    this.render();
  },

  navigateTo(page) {
    if (this.currentPage === page) return;
    this.currentPage = page;
    window.location.hash = page;
    this.render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  },

  // 隐藏骨架屏
  _hideSkeleton() {
    const app = document.getElementById('app');
    if (app) app.style.display = '';
    const skeleton = document.getElementById('app-skeleton');
    if (skeleton) {
      skeleton.classList.add('hide');
      setTimeout(() => skeleton.remove(), 400);
    }
  },

  render() {
    const app = document.getElementById('app');
    if (!app) return;

    // 隐藏骨架屏
    this._hideSkeleton();

    // 未登录时不要渲染页面
    if (!Auth.isLoggedIn()) {
      Auth.renderLoginPage(app);
      return;
    }

    const page = this.pages[this.currentPage];
    if (!page) {
      this.navigateTo('dashboard');
      return;
    }

    // 对于仪表盘，完全替换内容（包含hero区）
    if (this.currentPage === 'dashboard') {
      app.innerHTML = `
        <div id="dashboard-content" class="page-enter" style="padding-bottom: calc(var(--navbar-height) + var(--space-xl)); position: relative; z-index: 1;"></div>
        <nav class="navbar" id="navbar" style="z-index: 200;"></nav>
      `;

      page.render(document.getElementById('dashboard-content'));
      Components.renderNavbar(document.getElementById('navbar'), this.currentPage);
    } else {
      // 非仪表盘页面：标准结构
      app.innerHTML = `
        <div class="page-content page-enter" id="page-content" style="position: relative; z-index: 1;"></div>
        <nav class="navbar" id="navbar" style="z-index: 200;"></nav>
      `;

      page.render(document.getElementById('page-content'));
      Components.renderNavbar(document.getElementById('navbar'), this.currentPage);
    }
  },

  checkReminders() {
    if (!('Notification' in window)) return;

    const remindItems = Store.getRemindAnniversaries();
    if (remindItems.length === 0) return;

    if (Notification.permission === 'default') {
      Notification.requestPermission();
    }

    if (Notification.permission === 'granted') {
      remindItems.forEach(item => {
        const msg = item.daysUntil === 0
          ? `今天是「${item.name}」！别忘了哦`
          : `「${item.name}」还有 ${item.daysUntil} 天`;

        const notifyKey = `notify_${item.id}_${Utils.getToday()}`;
        if (!localStorage.getItem(notifyKey)) {
          new Notification('我们的恋爱小宇宙', {
            body: msg,
            icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23BFA8A8"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>',
            tag: item.id,
            requireInteraction: item.daysUntil <= 3
          });
          localStorage.setItem(notifyKey, '1');
        }
      });
    }
  }
};

// ===== 启动应用 =====
document.addEventListener('DOMContentLoaded', () => {
  App.init();
});
</script>
