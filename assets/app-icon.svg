<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE4EC"/>
      <stop offset="40%" stop-color="#FFB8D0"/>
      <stop offset="100%" stop-color="#FF8FAB"/>
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD1E0"/>
      <stop offset="100%" stop-color="#FF8FAB"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.25"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 黑色圆角背景 -->
  <rect width="1024" height="1024" rx="200" ry="200" fill="#1A1A1A"/>

  <!-- 粉色水滴脸 -->
  <path d="M 120 520
           C 120 320 280 160 480 160
           C 680 160 840 300 840 480
           C 840 620 780 720 720 760
           C 760 840 820 920 760 940
           C 700 960 620 900 560 840
           C 540 850 510 855 480 855
           C 280 855 120 720 120 520 Z"
        fill="url(#faceGrad)"
        filter="url(#softShadow)"/>

  <!-- 左眼（竖线眨眼） -->
  <rect x="270" y="420" width="48" height="150" rx="24" fill="#2D2D2D" transform="rotate(-6 294 495)"/>

  <!-- 右眼（> 形眨眼） -->
  <path d="M 510 430 L 620 485 L 510 540 Z" fill="#2D2D2D"/>

  <!-- 微笑嘴巴 -->
  <path d="M 340 670 Q 500 760 640 630 Q 500 830 340 670" fill="#2D2D2D"/>

  <!-- 大爱心 -->
  <path d="M 720 220
           C 680 180 610 180 580 230
           C 550 180 480 180 450 230
           C 420 280 480 360 580 420
           C 680 360 740 280 720 220 Z"
        fill="url(#heartGrad)"
        filter="url(#softShadow)"/>

  <!-- 小爱心 -->
  <path d="M 820 330
           C 800 310 760 310 750 340
           C 740 310 700 310 680 340
           C 660 370 700 420 750 450
           C 800 420 840 370 820 330 Z"
        fill="url(#heartGrad)"
        filter="url(#softShadow)"/>
</svg>